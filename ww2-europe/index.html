<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欧洲二战全过程</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #1c2230;
    --border: #2a3242;
    --text: #e6edf3;
    --muted: #8b96a5;
    --axis: #e5534b;
    --axis-occupied: #7a2e2a;
    --allies: #3b82f6;
    --neutral: #4a5568;
    --gold: #d4a72c;
    --sea: #0e1b2b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  .topbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 24px;
    background: rgba(13,17,23,0.9);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .topbar .brand { font-weight: 700; letter-spacing: 1px; }
  .lang-switch {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 16px; cursor: pointer; font-size: 0.85rem;
    transition: all .2s;
  }
  .lang-switch:hover { border-color: var(--muted); }

  header {
    padding: 56px 20px 40px;
    text-align: center;
    background: radial-gradient(1200px 400px at 50% -10%, rgba(229,83,75,0.15), transparent);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 2.4rem; letter-spacing: 2px; margin-bottom: 10px; }
  header p { color: var(--muted); font-size: 1.05rem; }

  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 16px; max-width: 900px; margin: 28px auto 0;
  }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .stat .num { font-size: 1.6rem; font-weight: 700; color: var(--gold); }
  .stat .label { color: var(--muted); font-size: 0.85rem; }

  .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
  section { margin-bottom: 56px; }
  section > h2 { font-size: 1.5rem; margin-bottom: 6px; padding-left: 14px; border-left: 4px solid var(--axis); }
  .sub { color: var(--muted); margin: 0 0 20px 14px; font-size: 0.95rem; }

  .btn {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 14px; cursor: pointer; font-size: 0.9rem; transition: all .2s;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--axis); border-color: var(--axis); color: #fff; }
  .btn.primary:hover { background: #d44a43; }

  .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
  .filters button {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 16px; cursor: pointer; font-size: 0.9rem; transition: all .2s;
  }
  .filters button:hover { border-color: var(--muted); }
  .filters button.active { background: var(--axis); border-color: var(--axis); color: #fff; }

  .timeline { position: relative; padding-left: 40px; }
  .timeline::before {
    content: ""; position: absolute; left: 14px; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(var(--axis), var(--allies)); border-radius: 2px;
  }
  .event {
    position: relative; margin-bottom: 28px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px; cursor: pointer;
    transition: transform .2s, border-color .2s, box-shadow .2s;
    animation: fadeIn .5s ease both;
  }
  .event:hover { transform: translateX(6px); border-color: var(--muted); }
  .event.playing { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(212,167,44,.4); }
  .event::before {
    content: ""; position: absolute; left: -33px; top: 24px; width: 14px; height: 14px;
    border-radius: 50%; background: var(--bg); border: 3px solid var(--axis);
  }
  .event.allies::before { border-color: var(--allies); }
  .event.neutral::before { border-color: var(--neutral); }
  .event .date { color: var(--gold); font-weight: 700; font-size: 0.9rem; letter-spacing: 1px; }
  .event h3 { font-size: 1.15rem; margin: 6px 0; }
  .event .phase-tag {
    display: inline-block; font-size: 0.7rem; padding: 2px 8px; border-radius: 4px;
    margin-bottom: 8px; background: var(--panel2); border: 1px solid var(--border);
  }
  .event .desc { color: var(--muted); font-size: 0.93rem; }
  .event .detail { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 0.92rem; }
  .event.open .detail { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .chart-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; position: relative; }
  .legend { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 10px; color: var(--muted); font-size: 0.85rem; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  /* 地图 */
  .map-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .map-year { text-align: center; font-size: 1.5rem; font-weight: 700; color: var(--gold); margin-bottom: 2px; }
  .map-phase { text-align: center; font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
  .map-desc { color: var(--text); font-size: 0.95rem; line-height: 1.7; text-align: center; max-width: 780px; margin: 0 auto 12px; min-height: 2.4em; }
  .map-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; margin-bottom: 6px; }
  .map-counter { text-align: center; color: var(--muted); font-size: 0.8rem; margin-bottom: 10px; }
  .map-stats { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
  .map-svg-wrap { position: relative; }
  #europeMap polygon { transition: fill .5s ease; stroke: #0d1117; stroke-width: 1; cursor: pointer; }
  #europeMap polygon:hover { stroke: #fff; stroke-width: 1.5; }
  #europeMap text { pointer-events: none; user-select: none; }
  #europeMap .battle { cursor: pointer; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  #mapSpeed { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 0.85rem; cursor: pointer; }
  .tooltip {
    position: absolute; background: #000; border: 1px solid var(--border);
    padding: 8px 12px; border-radius: 8px; font-size: 0.85rem;
    pointer-events: none; white-space: nowrap; display: none; z-index: 10;
  }

  .figures { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; }
  .figure {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; text-align: center; transition: transform .2s, border-color .2s;
  }
  .figure:hover { transform: translateY(-4px); border-color: var(--muted); }
  .avatar {
    width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem; font-weight: 700; color: #fff; border: 3px solid var(--border);
  }
  .avatar.axis { background: linear-gradient(135deg, #e5534b, #7a2e2a); }
  .avatar.allies { background: linear-gradient(135deg, #3b82f6, #1e40af); }
  .figure .name { font-size: 1.15rem; font-weight: 700; }
  .figure .en-name { color: var(--muted); font-size: 0.85rem; margin-bottom: 4px; }
  .figure .role { color: var(--gold); font-size: 0.85rem; margin-bottom: 8px; }
  .figure .fact { color: var(--muted); font-size: 0.85rem; text-align: left; }

  footer { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 0.85rem; border-top: 1px solid var(--border); }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand" data-i18n="brand">欧洲二战全过程</div>
  <button class="lang-switch" id="langSwitch">EN</button>
</div>

<header>
  <h1 data-i18n="title">欧洲二战全过程</h1>
  <p data-i18n="subtitle">1939 — 1945 · 从入侵波兰到德国无条件投降</p>
  <div class="stats" id="stats"></div>
</header>

<div class="container">

  <section id="map">
    <h2 data-i18n="mapTitle">欧洲领土控制变化</h2>
    <p class="sub" data-i18n="mapSub">拖动或播放查看 1939–1945 年轴心国与盟军控制区域及关键战役的演变。</p>
    <div class="map-panel">
      <div class="map-year" id="mapYear">1939.09</div>
      <div class="map-phase" id="mapPhase"></div>
      <div class="map-desc" id="mapDesc"></div>
      <div class="map-toolbar">
        <button class="btn primary" id="mapPlay">&#9654;</button>
        <button class="btn" id="mapPrev">&#9664;</button>
        <button class="btn" id="mapNext">&#9658;</button>
        <input type="range" id="mapSlider" min="0" max="16" value="0" style="flex:1;min-width:160px;">
        <select id="mapSpeed">
          <option value="3500">0.5x</option>
          <option value="2500" selected>1x</option>
          <option value="1500">2x</option>
        </select>
      </div>
      <div class="map-counter" id="mapCounter"></div>
      <div class="map-svg-wrap">
        <svg id="europeMap" width="100%" viewBox="0 0 900 560" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="tooltip" id="mapTip"></div>
      </div>
      <div class="map-stats" id="mapStats"></div>
    </div>
    <div class="legend" id="mapLegend"></div>
  </section>

  <section id="chart">
    <h2 data-i18n="chartTitle">轴心国控制欧洲版图的变化</h2>
    <p class="sub" data-i18n="chartSub">以下曲线估算轴心国（纳粹德国及其盟友）控制的欧洲领土比例，从闪电战扩张到最终崩溃。</p>
    <div class="chart-wrap">
      <svg id="controlChart" width="100%" height="340" viewBox="0 0 900 340" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="tooltip" id="chartTip"></div>
    </div>
    <div class="legend" id="chartLegend"></div>
  </section>

  <section id="timeline">
    <h2 data-i18n="timelineTitle">事件时间轴</h2>
    <div class="filters" id="filters"></div>
    <div style="margin-bottom:18px;">
      <button class="btn primary" id="timelinePlay">&#9654; <span data-i18n="autoPlay">自动播放</span></button>
    </div>
    <div class="timeline" id="timelineList"></div>
  </section>

  <section id="figures">
    <h2 data-i18n="figuresTitle">关键人物</h2>
    <div class="figures" id="figuresList"></div>
  </section>

</div>

<footer data-i18n="footer">数据基于公开历史资料整理，为教学演示用途，部分数字为估算值。</footer>

<script>

// ================= 阶段 =================

  outbreak: { zh: "战争爆发", en: "Outbreak", color: "#d4a72c" },
  blitz:    { zh: "闪电战",   en: "Blitzkrieg", color: "#e5534b" },
  east:     { zh: "东线",     en: "Eastern Front", color: "#a83232" },
  turning:  { zh: "转折",     en: "Turning Point", color: "#3b82f6" },
  liberation:{ zh: "解放",    en: "Liberation", color: "#22c55e" },
  end:      { zh: "终结",     en: "Final Defeat", color: "#8b5cf6" },

// ================= 事件 =================
const events = [
  { date:{zh:"1939年9月1日",en:"1 Sep 1939"}, phase:"outbreak", side:"axis",
    title:{zh:"德国入侵波兰",en:"Germany invades Poland"},
    desc:{zh:"德军以闪电战突袭波兰，第二次世界大战欧洲战场爆发。",en:"Germany launches a Blitzkrieg on Poland, starting WWII in Europe."},
    detail:{zh:"德军出动约60个师、2000多辆坦克和飞机，实施空地一体化的闪电战。两天后，英国和法国对德宣战，但未采取实质性军事行动，进入所谓的「假战」阶段。波兰在一个月内被占领。",en:"Germany attacked with ~60 divisions, 2000+ tanks and aircraft. Britain and France declared war two days later but took little action, entering the 'Phoney War'. Poland fell within a month."} },
  { date:{zh:"1939年9月17日",en:"17 Sep 1939"}, phase:"outbreak", side:"axis",
    title:{zh:"苏联入侵波兰东部",en:"Soviet invasion of eastern Poland"},
    desc:{zh:"根据《莫洛托夫-里宾特洛甫条约》秘密议定书，苏联占领波兰东部。",en:"Under the secret protocol of the Molotov–Ribbentrop Pact, the USSR occupies eastern Poland."},

    detail:{zh:"芬兰军队凭借地形与战术在冰天雪地中给苏军造成巨大伤亡，但最终于1940年3月被迫割让约10%的领土。",en:"Finland inflicted heavy casualties on the Red Army but ceded ~10% of its territory in March 1940."} },

    detail:{zh:"在德军装甲部队暂停进攻的间隙，英国动员了大量民用船只参与撤退，保存了英军绝大部分有生力量。",en:"Britain mobilized hundreds of civilian 'little ships' to rescue the army, saving Britain's fighting force."} },

// ================= 渲染：统计 =================
function renderStats() {
  const el = document.getElementById("stats");
  el.innerHTML = stats.map(s =>
    `<div class="stat"><div class="num">${lang==="zh"?s.num:s.numEn}</div><div class="label">${t(s.label)}</div></div>`
  ).join("");

// ================= 渲染：时间轴 =================
let timelineFilter = "all";
function renderTimeline(filter) {
  if (filter !== undefined) timelineFilter = filter;
  const listEl = document.getElementById("timelineList");
  listEl.innerHTML = "";
  events.forEach((e, i) => {
    if (timelineFilter !== "all" && e.phase !== timelineFilter) return;
    const ph = PHASES[e.phase];
    const el = document.createElement("div");
    el.className = "event " + e.side;
    el.dataset.idx = i;
    el.style.animationDelay = (i * 0.03) + "s";
    el.innerHTML = `
      <div class="date">${tt(e.date)}</div>
      <span class="phase-tag" style="border-color:${ph.color};color:${ph.color};">${tt(ph)}</span>
      <h3>${tt(e.title)}</h3>
      <div class="desc">${tt(e.desc)}</div>
      <div class="detail">${tt(e.detail)}</div>`;
    el.addEventListener("click", () => el.classList.toggle("open"));
    listEl.appendChild(el);
  });
}

function renderFilters() {
  const el = document.getElementById("filters");
  const btn = (id, label, active) =>
    `<button data-phase="${id}" class="${active?'active':''}">${label}</button>`;
  el.innerHTML = btn("all", t("all"), timelineFilter==="all") +
    Object.keys(PHASES).map(id => btn(id, tt(PHASES[id]), timelineFilter===id)).join("");
  el.querySelectorAll("button").forEach(b => {
    b.addEventListener("click", () => {
      el.querySelectorAll("button").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      timelineFilter = b.dataset.phase;
      renderTimeline();
    });
  });
}

// ================= 渲染：图表 =================
function renderChart() {
  const svg = document.getElementById("controlChart");
  svg.innerHTML = "";
  const NS = "http://www.w3.org/2000/svg";
  const W = 900, H = 340, padL = 60, padR = 30, padT = 30, padB = 60;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const x = i => padL + plotW * i / (controlData.length - 1);
  const y = v => padT + plotH - plotH * v / 60;
  const add = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };

  for (let g = 0; g <= 60; g += 20) {
    svg.appendChild(add("line", { x1:padL, y1:y(g), x2:W-padR, y2:y(g), stroke:"#2a3242", "stroke-width":1 }));
    const tx = add("text", { x:padL-10, y:y(g)+4, "text-anchor":"end", fill:"#8b96a5", "font-size":11 });
    tx.textContent = g + "%"; svg.appendChild(tx);
  }
  [0,2,4,6,8,10,12,13].forEach(i => {
    const tx = add("text", { x:x(i), y:H-padB+24, "text-anchor":"middle", fill:"#8b96a5", "font-size":11 });
    tx.textContent = tt(controlData[i].label).split(/[.\s]/)[0].replace(/[年月]/g,""); svg.appendChild(tx);
  });

  const grad = add("linearGradient", { id:"areaGrad", x1:0, y1:0, x2:0, y2:1 });
  grad.appendChild(add("stop", { offset:"0%", "stop-color":"#e5534b", "stop-opacity":0.5 }));
  grad.appendChild(add("stop", { offset:"100%", "stop-color":"#e5534b", "stop-opacity":0 }));
  svg.appendChild(grad);

  let areaPath = `M ${x(0)} ${y(controlData[0].v)}`;
  controlData.forEach((d,i) => areaPath += ` L ${x(i)} ${y(d.v)}`);
  areaPath += ` L ${x(controlData.length-1)} ${y(0)} L ${x(0)} ${y(0)} Z`;
  svg.appendChild(add("path", { d:areaPath, fill:"url(#areaGrad)" }));

  let linePath = `M ${x(0)} ${y(controlData[0].v)}`;
  controlData.forEach((d,i) => linePath += ` L ${x(i)} ${y(d.v)}`);
  svg.appendChild(add("path", { d:linePath, fill:"none", stroke:"#e5534b", "stroke-width":3, "stroke-linejoin":"round" }));

  const tip = document.getElementById("chartTip");
  controlData.forEach((d,i) => {
    const c = add("circle", { cx:x(i), cy:y(d.v), r:6, fill:"#d4a72c", stroke:"#0d1117", "stroke-width":2, cursor:"pointer" });
    c.addEventListener("mouseenter", () => { tip.style.display="block"; tip.innerHTML = `<b>${tt(d.label)}</b><br>${lang==="zh"?"轴心控制约":"Axis controls ~"} ${d.v}% ${lang==="zh"?"欧洲领土":"of Europe"}`; });
    c.addEventListener("mousemove", ev => { tip.style.left = ev.clientX+14+"px"; tip.style.top = ev.clientY-30+"px"; });
    c.addEventListener("mouseleave", () => tip.style.display="none");
    svg.appendChild(c);
  });

  const peak = controlData.reduce((a,b) => a.v>b.v?a:b);
  const pk = add("text", { x:x(controlData.indexOf(peak)), y:y(peak.v)-14, "text-anchor":"middle", fill:"#e5534b", "font-size":12, "font-weight":700 });
  pk.textContent = (lang==="zh"?"峰值":"Peak") + " " + peak.v + "%";
  svg.appendChild(pk);

  document.getElementById("chartLegend").innerHTML = `
    <span><span class="dot" style="background:#e5534b"></span>${t("legendCurve")}</span>
    <span><span class="dot" style="background:#3b82f6"></span>${t("legendCounter")}</span>
    <span><span class="dot" style="background:#d4a72c"></span>${t("legendNode")}</span>`;
}

// ================= 渲染：地图 =================
let mapPeriod = 0;
let mapPlaying = false, mapTimer = null, mapSpeed = 2500;

function bindTip(el, htmlFn) {
  const tip = document.getElementById("mapTip");
  el.addEventListener("mouseenter", () => { tip.style.display="block"; tip.innerHTML = htmlFn(); });
  el.addEventListener("mousemove", ev => { tip.style.left = ev.clientX+14+"px"; tip.style.top = ev.clientY-30+"px"; });
  el.addEventListener("mouseleave", () => tip.style.display="none");
}

function renderMap() {
  const svg = document.getElementById("europeMap");
  svg.innerHTML = "";
  const NS = "http://www.w3.org/2000/svg";
  const p = periods[mapPeriod];
  const add = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };

  document.getElementById("mapYear").textContent = p.year;
  document.getElementById("mapPhase").textContent = tt(p.label);
  document.getElementById("mapDesc").textContent = tt(p.desc);
  document.getElementById("mapCounter").textContent = t("stage").replace("{i}", mapPeriod+1).replace("{n}", periods.length);
  document.getElementById("mapSlider").max = periods.length - 1;
  document.getElementById("mapSlider").value = mapPeriod;

  // 海洋背景
  svg.appendChild(add("rect", { x:0, y:0, width:900, height:560, fill:"#0e1b2b" }));
  // 海域标签
  seaLabels.forEach(s => {
    const tx = add("text", { x:s.x, y:s.y, "text-anchor":"middle", fill:"#4a6b8a", "font-size":9, "font-style":"italic", opacity:0.75 });
    tx.textContent = tt(s); svg.appendChild(tx);
  });

  // 国家
  let axisCount = 0;
  countries.forEach(c => {
    const state = p.control[c.id];
    if (state === "axis" || state === "occupied") axisCount++;
    const color = STATE_COLORS[state];
    c.shapes.forEach(pts => {
      const poly = add("polygon", { points:pts, fill:color });
      bindTip(poly, () => `<b>${tt(c.name)}</b><br>${t("state"+capitalize(state))}`);
      svg.appendChild(poly);
    });
    const lbl = add("text", { x:c.lx, y:c.ly, "text-anchor":"middle", fill:"#0d1117", "font-size":9, "font-weight":700 });
    lbl.textContent = c.label; svg.appendChild(lbl);
  });

  // 城市
  cities.forEach(ct => {
    svg.appendChild(add("circle", { cx:ct.x, cy:ct.y, r:3, fill:"#e6edf3", stroke:"#0d1117", "stroke-width":1 }));
    const lbl = add("text", { x:ct.x+6, y:ct.y-4, fill:"#cbd5e1", "font-size":9 });
    lbl.textContent = tt(ct.name); svg.appendChild(lbl);
  });

  // 战役（时间窗口内显示）
  battles.forEach(b => {
    if (mapPeriod < b.at || mapPeriod > b.at + 2) return;
    const star = add("text", { x:b.x, y:b.y, "text-anchor":"middle", fill:"#f5c518", "font-size":14, "font-weight":700, class:"battle" });
    star.textContent = "★";
    bindTip(star, () => `<b>${tt(b.name)}</b><br>${tt(b.date)}`);
    svg.appendChild(star);
  });

  document.getElementById("mapStats").textContent = t("axisCount").replace("{n}", axisCount);

  document.getElementById("mapLegend").innerHTML = `
    <span><span class="dot" style="background:${STATE_COLORS.axis}"></span>${t("stateAxis")}</span>
    <span><span class="dot" style="background:${STATE_COLORS.occupied}"></span>${t("stateOccupied")}</span>
    <span><span class="dot" style="background:${STATE_COLORS.allies}"></span>${t("stateAllies")}</span>
    <span><span class="dot" style="background:${STATE_COLORS.neutral}"></span>${t("stateNeutral")}</span>
    <span><span style="color:#f5c518;font-size:14px;line-height:1;">★</span>${t("legendBattle")}</span>
    <span><span class="dot" style="background:#e6edf3"></span>${t("legendCity")}</span>`;
}
function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

function setMapPeriod(i, keepPlaying) {
  mapPeriod = Math.max(0, Math.min(periods.length-1, i));
  renderMap();
  if (mapPlaying && mapPeriod >= periods.length-1) stopMapPlay();
  if (!keepPlaying) document.getElementById("mapPlay").innerHTML = "&#9654;";
}

function startMapTimer() {
  clearInterval(mapTimer);
  mapTimer = setInterval(() => {
    if (mapPeriod >= periods.length-1) { stopMapPlay(); return; }
    setMapPeriod(mapPeriod+1, true);
  }, mapSpeed);
}
function startMapPlay() {
  mapPlaying = true;
  mapPeriod = 0;
  renderMap();
  document.getElementById("mapPlay").innerHTML = "&#10074;&#10074;";
  startMapTimer();
}
function stopMapPlay() {
  mapPlaying = false;
  clearInterval(mapTimer);
  document.getElementById("mapPlay").innerHTML = "&#9654;";
}

// ================= 渲染：人物 =================
function renderFigures() {
  document.getElementById("figuresList").innerHTML = figures.map(f => `
    <div class="figure">
      <div class="avatar ${f.side}">${f.initial}</div>
      <div class="name">${tt(f.name)}</div>
      <div class="en-name">${lang==="zh"?f.name.en:f.name.zh}</div>
      <div class="role">${tt(f.role)}</div>
      <div class="fact">${tt(f.fact)}</div>
    </div>`).join("");
}

// ================= 时间轴自动播放 =================
let tlPlaying = false, tlTimer = null, tlIdx = 0;
function timelinePlayToggle() {
  const btn = document.getElementById("timelinePlay");
  if (tlPlaying) {
    tlPlaying = false; clearInterval(tlTimer);
    document.querySelectorAll(".event.playing").forEach(e => e.classList.remove("playing"));
    btn.innerHTML = "&#9654; <span>" + t("autoPlay") + "</span>";
    return;
  }
  tlPlaying = true; tlIdx = 0;
  btn.innerHTML = "&#10074;&#10074; <span>" + t("pause") + "</span>";
  const els = Array.from(document.querySelectorAll("#timelineList .event"));
  if (els.length === 0) { tlPlaying = false; return; }
  tlTimer = setInterval(() => {
    if (tlIdx >= els.length) { timelinePlayToggle(); return; }
    els.forEach(e => e.classList.remove("playing"));
    const el = els[tlIdx];
    el.classList.add("playing");
    el.scrollIntoView({ behavior:"smooth", block:"center" });
    tlIdx++;
  }, 2800);
}

// ================= 应用语言 =================
function applyI18n() {
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  renderStats();
  renderTimeline();
  renderFilters();
  renderChart();
  renderMap();
  renderFigures();
  document.getElementById("langSwitch").textContent = lang==="zh" ? "EN" : "中文";
  if (tlPlaying) { timelinePlayToggle(); }
}

// ================= 初始化 =================
document.getElementById("langSwitch").addEventListener("click", () => { lang = lang==="zh"?"en":"zh"; applyI18n(); });

document.getElementById("mapPlay").addEventListener("click", () => mapPlaying ? stopMapPlay() : startMapPlay());
document.getElementById("mapPrev").addEventListener("click", () => setMapPeriod(mapPeriod-1));
document.getElementById("mapNext").addEventListener("click", () => setMapPeriod(mapPeriod+1));
document.getElementById("mapSlider").addEventListener("input", e => setMapPeriod(+e.target.value));
document.getElementById("mapSpeed").addEventListener("change", e => {
  mapSpeed = +e.target.value;
  if (mapPlaying) startMapTimer();
});
document.getElementById("timelinePlay").addEventListener("click", timelinePlayToggle);

applyI18n();
</script>
