<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KARDS Lite - WWII Card Game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Arial Black", "Segoe UI", Arial, sans-serif;
    background: radial-gradient(circle at 50% 30%, #3a4d33 0%, #1e2a1c 60%, #121a10 100%);
    color: #e8e0c8;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #fit { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #stage { transform-origin: center center; }

  header { width: 100%; text-align: center; padding: 8px 0 2px; }
  header h1 {
    font-size: 20px;
    letter-spacing: 5px;
    color: #c9b458;
    text-shadow: 2px 2px 0 #000000, 0 0 12px rgba(201,180,88,.4);
  }
  #turnbar {
    display: inline-block;
    margin-top: 4px;
    padding: 4px 18px;
    border: 2px solid #c9b458;
    border-radius: 20px;
    background: rgba(0,0,0,.45);
    font-size: 13px;
    letter-spacing: 2px;
    color: #f0e6c8;
  }
  #log {
    margin: 4px auto;
    min-height: 30px;
    max-width: 700px;
    padding: 4px 12px;
    font-family: Consolas, monospace;
    font-size: 11px;
    color: #a8b89c;
    text-align: center;
  }

  .panel { display: flex; flex-direction: column; align-items: center; width: 100%; }

  .prow { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 92%; max-width: 760px; }

  .hqbox { display: inline-flex; align-items: center; gap: 8px; }
  .hqcard {
    width: 80px; height: 104px;
    background: linear-gradient(160deg, #4c5a44, #232d20);
    border: 3px solid #c9b458;
    border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; cursor: default;
  }
  .hqcard .star { position: absolute; top: 5px; left: 50%; transform: translateX(-50%); font-size: 11px; color: #c9b458; letter-spacing: 1px; }
  .hqcard .hpbar-wrap { position: absolute; bottom: 5px; left: 5px; right: 5px; }
  .hpbar-wrap { height: 10px; background: rgba(0,0,0,.55); border-radius: 6px; overflow: hidden; border: 1px solid #000; }
  .hpbar { height: 100%; background: linear-gradient(180deg, #6fc96f, #2f7d2f); transition: width .3s; }
  .hpbar.low { background: linear-gradient(180deg, #e08a5a, #b3382a); }
  .hpnum { font-size: 15px; color: #fff; text-shadow: 1px 1px 0 #000; }
  .hqcard.targetable { cursor: crosshair; border-color: #ffd95e; box-shadow: 0 0 14px 3px rgba(255,217,94,.55); }

  .stackbox { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: #b9c4a8; letter-spacing: 1px; }
  .stackcard { width: 36px; height: 48px; background: repeating-linear-gradient(45deg, #33301f, #33301f 5px, #45412a 5px, #45412a 10px); border: 2px solid #5a563c; border-radius: 6px; }

  .hand { display: flex; justify-content: center; gap: 6px; min-height: 140px; padding: 8px 4px; flex-wrap: wrap; }
  .hand .cardwrap { cursor: default; }

  .boardrow { display: flex; justify-content: center; gap: 10px; min-height: 144px; padding: 6px 4px; }

  .cardwrap { width: 98px; text-align: center; }
  .card {
    width: 94px; height: 126px; margin: 0 auto;
    border: 3px solid #6f6040; border-radius: 8px;
    background: linear-gradient(170deg, #d9d0b0, #b0a67f);
    position: relative; color: #26220f;
    box-shadow: 0 4px 8px rgba(0,0,0,.55);
    transition: transform .15s, box-shadow .15s, filter .15s;
    touch-action: manipulation;
  }
  .card:hover { transform: translateY(-6px); }
  .card:active { transform: translateY(-2px) scale(.97); }
  .card .cost {
    position: absolute; top: -4px; left: -4px;
    width: 22px; height: 22px; border-radius: 50%;
    background: #24407a; border: 2px solid #fff;
    color: #fff; font-size: 13px; line-height: 18px; text-align: center;
  }
  .card .atk { position: absolute; left: -4px; bottom: -4px; width: 22px; height: 22px; border-radius: 50%; background: #7a2424; border: 2px solid #fff; color: #fff; font-size: 13px; line-height: 18px; text-align: center; }
  .card .hp { position: absolute; right: -4px; bottom: -4px; width: 22px; height: 22px; border-radius: 50%; background: #25742c; border: 2px solid #fff; color: #fff; font-size: 13px; line-height: 18px; text-align: center; }
  .card .cname {
    position: absolute; top: 7px; left: 20px; right: 4px;
    font-size: 10px; text-align: center; white-space: normal; line-height: 1.05; overflow: hidden;
  }
  .card .art { position: absolute; top: 28px; left: 6px; right: 6px; height: 68px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 34px; color: #3d3a2a; background: rgba(60,80,60,.28); }
  .card.guard .art::after, .card.air .art::after { content: ""; display: none; }
  .badge {
    position: absolute; top: 30px; right: 5px;
    font-size: 7px; letter-spacing: 1px; padding: 1px 4px; border-radius: 8px; color: #fff;
  }
  .badge.guard { background: #5a5c8c; }
  .badge.air { background: #7a4c8c; }
  .badge.exhausted { background: #8a4c22; }
  .card.exhausted { filter: grayscale(.85) brightness(.92); }
  .card.playable { border-color: #ffd95e; box-shadow: 0 0 12px 2px rgba(255,217,94,.45); }
  .card.unplayable { filter: brightness(.55); }
  .card.selected { border-color: #ff7a5e; box-shadow: 0 0 16px 4px rgba(255,122,94,.7); }
  .card.targetable { border-color: #ffd95e; box-shadow: 0 0 14px 3px rgba(255,217,94,.6); cursor: crosshair; }
  .card.incapable { opacity: .45; }
  .card.order { border-color: #c9b458; background: linear-gradient(170deg, #f0e6c0, #cbbd85); }
  .card.order .art { background: rgba(150,125,45,.28); color: #4a411c; }
  .otext { position: absolute; bottom: 8px; left: 6px; right: 6px; font-size: 8px; line-height: 1.15; text-align: center; color: #5a4f1e; }
  .utext { position: absolute; left: 5px; right: 5px; text-align: center; font-size: 6.5px; line-height: 1.12; color: #463c10; overflow: hidden; }
  .card.hasskill .art { top: 22px; height: 32px; font-size: 22px; }
  .card.hasskill .utext { top: 58px; bottom: 18px; font-size: 7px; line-height: 1.15; }

  .cardback { width: 70px; height: 96px; border: 3px solid #6f6040; border-radius: 8px; background: repeating-linear-gradient(45deg, #2c2a1c, #2c2a1c 7px, #3c3a26 7px, #3c3a26 14px); position: relative; }
  .cardback::after { content: "★"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #c9b458; font-size: 18px; }

  #menu { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 0 2px; }
  #menu .mgroup { display: flex; gap: 8px; }
  .btn.mmode { padding: 6px 18px; font-size: 12px; }
  .btn.mmode.active { background: rgba(201,180,88,.35); color: #fff; border-color: #ffd95e; }
  #onlinePanel { display: none; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
  #onlinePanel input {
    font-family: inherit; font-size: 12px; padding: 6px 10px; width: 130px;
    background: rgba(0,0,0,.4); color: #f0e6c8; border: 2px solid #6f6040; border-radius: 8px; outline: none;
  }
  #onlinePanel input:focus { border-color: #c9b458; }
  #onlinePanel .btn { padding: 6px 16px; font-size: 12px; }

  #lobby { display: none; flex-direction: column; align-items: center; gap: 6px; margin-top: 6px; padding: 10px 18px; border: 1px solid #565c3d; border-radius: 8px; background: rgba(0,0,0,.25); min-width: 240px; }
  #lobby .lobbyRow { display: flex; gap: 10px; width: 100%; justify-content: space-between; font-size: 12px; color: #e6e9d5; }
  #lobby .lobbyRow .lbl { color: #8a917c; }
  #lobby .lobbyRow #lobbyRoom { color: #c9b458; font-size: 15px; letter-spacing: 2px; }
  #lobby #lobbyStart { margin-top: 6px; }
  #lobby #lobbyStart[disabled] { opacity: .4; }
  #lobby #lobbyWait { font-size: 11px; color: #b9c4a8; min-height: 14px; }
  #onlineStatus { font-size: 12px; color: #b9c4a8; letter-spacing: 1px; min-height: 16px; }

  footer { display: flex; gap: 16px; padding: 10px 0 16px; }
  .btn {
    font-family: inherit; font-size: 13px; letter-spacing: 2px;
    padding: 8px 24px; border-radius: 8px; border: 2px solid #c9b458;
    background: rgba(0,0,0,.4); color: #f0e6c8; cursor: pointer;
    touch-action: manipulation;
  }
  .btn:hover { background: rgba(201,180,88,.25); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  #modal {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.72);
    align-items: center; justify-content: center; z-index: 50;
  }
  #modal.show { display: flex; }
  #modal .box {
    padding: 24px 34px; text-align: center;
    background: linear-gradient(160deg, #33371f, #1c2012);
    border: 3px solid #c9b458; border-radius: 12px;
  }
  #modal .box h2 { font-size: 18px; letter-spacing: 3px; margin-bottom: 4px; color: #c9b458; }
  #modal .box p { font-size: 12px; color: #b9c4a8; margin-bottom: 16px; }
  #modal .tip { font-size: 10px; color: #8a917c; margin-top: -10px; margin-bottom: 14px; }

  #roomlist { display: none; position: fixed; top: 0; left: 0; bottom: 0; right: 0; background: rgba(0,0,0,.6); align-items: center; justify-content: center; z-index: 50; }
  #roomlist.show { display: flex; }
  #roomlist .rbox { max-height: 72vh; overflow: auto; background: linear-gradient(160deg, #33371f, #1c2012); border: 3px solid #c9b458; border-radius: 12px; padding: 18px 22px; width: 330px; }
  #roomlist h2 { font-size: 16px; letter-spacing: 3px; color: #c9b458; text-align: center; margin-bottom: 10px; }
  #roomlist .rrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 0; border-bottom: 1px solid #3a4030; font-size: 13px; color: #e6e9d5; }
  #roomlist .rrow .rrowc { color: #c9b458; letter-spacing: 1px; font-weight: bold; }
  #roomlist .rrow .btn { padding: 4px 12px; font-size: 11px; }
  #roomlist .tip { font-size: 11px; color: #8a917c; text-align: center; margin: 12px 0; }
  #roomlist .btns { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }

  #tutorial { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.72); align-items: center; justify-content: center; z-index: 60; }
  #tutorial.show { display: flex; }
  #tutorial .tbox {
    position: relative; width: 460px; max-width: 92vw; max-height: 84vh; overflow: auto;
    background: linear-gradient(160deg, #33371f, #1c2012);
    border: 3px solid #c9b458; border-radius: 12px; padding: 22px 26px 18px;
  }
  #tutorial .tclose {
    position: absolute; top: 8px; right: 12px; width: 28px; height: 28px; line-height: 26px;
    text-align: center; font-size: 15px; color: #c9b458; cursor: pointer;
    border: 2px solid #6f6040; border-radius: 50%; background: rgba(0,0,0,.35);
  }
  #tutorial .tclose:hover { background: rgba(201,180,88,.3); color: #fff; }
  #tutorial h2 { font-size: 16px; letter-spacing: 3px; color: #c9b458; margin-bottom: 12px; padding-right: 34px; }
  #tutorial .tbody {
    font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; line-height: 1.7;
    color: #e6e9d5; min-height: 168px;
  }
  #tutorial .tbody b { color: #ffd95e; }
  #tutorial .tbody ul { padding-left: 20px; margin: 6px 0; }
  #tutorial .tbody li { margin-bottom: 6px; }
  #tutorial .tbody p { margin-bottom: 8px; }
  #tutorial .tfoot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
  #tutorial .tfoot .btn { padding: 6px 18px; font-size: 12px; }
  #tutorial .tfoot .btn[disabled] { opacity: .3; }
  #tutorial .dots { font-size: 11px; color: #8a917c; letter-spacing: 2px; }

  #flash {
    position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .16s;
    background: radial-gradient(circle at 50% 50%, rgba(255,80,80,0) 35%, rgba(200,0,0,.55) 100%);
    z-index: 40;
  }
  #flash.on { opacity: 1; }
  @keyframes hqshake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .hqcard.shake { animation: hqshake .3s ease; }
  @keyframes pop { from { transform: scale(.6); opacity: .2; } to { transform: scale(1); opacity: 1; } }
  .card.pop { animation: pop .18s ease; }

  #factionpick, #deckedit { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); align-items: center; justify-content: center; z-index: 60; }
  #factionpick.show, #deckedit.show { display: flex; }
  .fbox, .dbox {
    width: 500px; max-width: 92vw; max-height: 84vh; overflow: auto;
    background: linear-gradient(160deg, #33371f, #1c2012);
    border: 3px solid #c9b458; border-radius: 12px; padding: 20px 22px;
  }
  .fbox h2, .dbox h2 { font-size: 15px; letter-spacing: 3px; color: #c9b458; text-align: center; margin-bottom: 14px; }
  .frow {
    display: flex; gap: 12px; align-items: center; padding: 12px; margin-bottom: 8px;
    border: 2px solid #4a5033; border-radius: 10px; cursor: pointer; background: rgba(0,0,0,.25);
  }
  .frow:hover { border-color: #c9b458; }
  .frow.sel { border-color: #ffd95e; }
  .frow .fflag { font-size: 30px; }
  .frow .fname { font-size: 14px; letter-spacing: 2px; color: #f0e6c8; }
  .frow .fdesc { font-size: 11px; color: #8a917c; margin-top: 2px; }
  .frow .fbonus { font-size: 11px; color: #c9b458; margin-top: 4px; }
  .dinfo { font-size: 12px; color: #c9b458; text-align: center; margin-bottom: 10px; }
  .drow { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid #2c3322; font-size: 12px; color: #e6e9d5; }
  .drow .dname { flex: 1; }
  .drow .dtag { font-size: 9px; color: #8a917c; letter-spacing: 1px; }
  .drow .dnum { width: 26px; text-align: center; color: #ffd95e; font-weight: bold; }
  .drow .dbtn { padding: 2px 10px; font-size: 12px; }
  .dbtns { display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .dbtns .btn { padding: 6px 14px; font-size: 11px; }
  .dbtns .btn.active { background: rgba(201,180,88,.35); color: #fff; border-color: #ffd95e; }
  .fpgroup { font-size: 12px; letter-spacing: 2px; color: #c9b458; text-align: center; margin: 12px 0 8px; }
  #achieve { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); align-items: center; justify-content: center; z-index: 60; }
  #achieve.show { display: flex; }
  .abox {
    position: relative; width: 500px; max-width: 92vw; max-height: 84vh; overflow: auto;
    background: linear-gradient(160deg, #33371f, #1c2012);
    border: 3px solid #c9b458; border-radius: 12px; padding: 20px 22px;
  }
  .abox h2 { font-size: 15px; letter-spacing: 3px; color: #c9b458; text-align: center; margin-bottom: 6px; }
  .ainfo { font-size: 11px; color: #8a917c; text-align: center; margin-bottom: 12px; }
  .arow { display: flex; gap: 10px; align-items: center; padding: 7px 2px; border-bottom: 1px solid #2c3322; font-size: 12px; color: #e6e9d5; }
  .arow.locked { opacity: .42; }
  .arow .aico { font-size: 18px; width: 24px; text-align: center; color: #7fb069; }
  .arow.locked .aico { color: #5a5f4a; }
  .arow .aname { font-weight: bold; color: #ffd95e; }
  .arow .adesc { font-size: 11px; color: #8a917c; }
  #toast {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 100;
    background: #2a2f18; border: 2px solid #c9b458; color: #ffd95e; padding: 10px 18px;
    border-radius: 8px; font-size: 13px; letter-spacing: 1px; opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  #toast.show { opacity: 1; }

  /* effects */
  #fit.shake { animation: k6shake .25s; }
  @keyframes k6shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-6px, 0); }
    40% { transform: translate(6px, 0); }
    60% { transform: translate(-4px, 0); }
    80% { transform: translate(4px, 0); }
  }
  #modal.show .box { animation: k6pop .22s ease; }
  @keyframes k6pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #log.flash { animation: k6fade .3s ease; }
  @keyframes k6fade { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
  <div id="fit">
    <div id="stage">
      <header>
        <h1>KARDS LITE<span style="font-size:9px;color:#7d865f;vertical-align:top;margin-left:6px;">v20</span></h1>
        <div id="turnbar">Player 1's Turn</div>
      </header>

      <div id="menu">
        <div class="mgroup">
          <button class="btn mmode active" id="modeLocal" onclick="setMode('local')">LOCAL</button>
          <button class="btn mmode" id="modeAi" onclick="setMode('ai')">VS AI</button>
          <button class="btn mmode" id="modeOnline" onclick="setMode('online')">ONLINE</button>
          <button class="btn mmode" onclick="openTutorial()">TUTORIAL</button>
          <button class="btn mmode" id="soundBtn" onclick="toggleSound()">SOUND ON</button>
        </div>
        <div class="mgroup">
          <button class="btn mmode" onclick="openFactionPick()">NATION</button>
          <button class="btn mmode" onclick="openDeckEdit()">DECK</button>
          <button class="btn mmode" onclick="openAchievements()">ACHIEVEMENTS</button>
        </div>
        <div id="onlinePanel">
          <input id="nameIn" maxlength="12" value="Player#1" onfocus="if(this.value==='Player#1'){this.value='';}" onblur="if(this.value===''){this.value='Player#1';}">
          <input id="roomIn" maxlength="6" placeholder="Room code" onkeydown="if(event.key==='Enter')joinGame();">
          <button class="btn" onclick="hostGame()">HOST</button>
          <button class="btn" onclick="joinGame()">JOIN</button>
          <button class="btn" onclick="browseRooms()">ROOMS</button>
        </div>
        <div id="lobby">
          <div class="lobbyRow"><span class="lbl">ROOM</span><span id="lobbyRoom"></span></div>
          <div class="lobbyRow"><span class="lbl">HOST</span><span id="lobbyHost"></span></div>
          <div class="lobbyRow"><span class="lbl">PLAYER 2</span><span id="lobbyP2"></span></div>
          <button class="btn" id="lobbyStart" onclick="lobbyStart()" disabled>START BATTLE</button>
          <div id="lobbyWait"></div>
        </div>
        <div id="onlineStatus"></div>
      </div>

      <div id="log"></div>

      <div class="panel" id="panelTop"></div>
      <div class="panel" id="panelMid"></div>
      <div class="panel" id="panelBottom"></div>

      <footer>
        <button class="btn" id="endBtn">END TURN</button>
        <button class="btn" id="newBtn">NEW GAME</button>
      </footer>
    </div>
  </div>

  <div id="modal">
    <div class="box">
      <h2 id="mTitle"></h2>
      <p id="mText"></p>
      <p class="tip" id="mTip"></p>
      <button class="btn" id="mBtn">Continue</button>
    </div>
  </div>

<div id="roomlist">
    <div class="rbox">
      <h2>OPEN ROOMS</h2>
      <div id="roomRows"></div>
      <div id="roomHint" class="tip">No rooms open right now.</div>
      <div class="btns">
        <button class="btn" onclick="refreshRooms()">REFRESH</button>
        <button class="btn" onclick="closeRooms()">CLOSE</button>
      </div>
    </div>
  </div>

  <div id="tutorial">
    <div class="tbox">
      <div class="tclose" onclick="closeTutorial()" title="Close tutorial">✕</div>
      <h2 id="tTitle"></h2>
      <div class="tbody" id="tBody"></div>
      <div class="tfoot">
        <span id="tPage" class="dots"></span>
        <span>
          <button class="btn" id="tPrev" onclick="tutPrev()">BACK</button>
          <button class="btn" id="tNext" onclick="tutNext()">NEXT</button>
        </span>
      </div>
    </div>
  </div>

  <div id="factionpick">
    <div class="fbox">
      <h2 id="fpTitle">CHOOSE YOUR NATION</h2>
      <div id="fpRows"></div>
      <div class="dbtns"><button class="btn" onclick="closeFactionPick()">CANCEL</button></div>
    </div>
  </div>

  <div id="deckedit">
    <div class="dbox">
      <h2>DECK BUILDER</h2>
      <div class="dbtns" id="deckWhich" style="display:none;margin-bottom:8px;">
        <button class="btn" id="dw1" onclick="openDeckEdit(1)">PLAYER 1</button>
        <button class="btn" id="dw2" onclick="openDeckEdit(2)">PLAYER 2</button>
      </div>
      <div class="dinfo" id="deckInfo"></div>
      <div id="deckRows"></div>
      <div class="dbtns">
        <button class="btn" onclick="deckUseDefault()">USE DEFAULT</button>
        <button class="btn" onclick="deckSave()">SAVE DECK</button>
        <button class="btn" onclick="closeDeckEdit()">CLOSE</button>
      </div>
    </div>
  </div>

  <div id="achieve">
    <div class="abox">
      <div class="tclose" onclick="closeAchievements()">✕</div>
      <h2>ACHIEVEMENTS</h2>
      <div class="ainfo" id="achInfo"></div>
      <div id="achRows"></div>

var PROFILE = null;

function defaultProfile() {
  return {
    fact1: "usa", fact2: "germany",
    decks: {},
    stats: { games: 0, wins: 0, losses: 0, aiWins: 0, localWins: 0, onlineWins: 0, byFaction: {}, flawlessWins: 0, blitzWins: 0, closeWins: 0, heals: 0, fullBoards: 0, bigUnits: 0, decksSaved: 0, tutDone: 0 },
    ach: {},
    sfx: true, tut: false
  };
}

function migrateProfile() {
  var p = defaultProfile();
  try {
    var f1 = localStorage.getItem("k6_fact"), f2 = localStorage.getItem("k6_fact2");
    if (f1) p.fact1 = FACTION_MIGRATE[f1] || f1;
    if (f2) p.fact2 = FACTION_MIGRATE[f2] || f2;
    var cd = localStorage.getItem("k6_deck_v2");
    if (cd) {
      var d = JSON.parse(cd), fac = null;
      Object.keys(d || {}).forEach(function (k) { var def = DEFS[k]; if (def && d[k] > 0) fac = def.f; });
      if (fac) p.decks[fac] = d;
    }
    var s = localStorage.getItem("k6_sfx");
    if (s !== null) p.sfx = (s !== "0");
    if (localStorage.getItem("k6_tut_v4") === "1") p.tut = true;
  } catch (e) {}
  return p;
}

function loadProfile() {
  var p = null;
  try { var raw = localStorage.getItem("k6_profile_v1"); if (raw) p = JSON.parse(raw); } catch (e) {}
  if (!p || typeof p !== "object") p = migrateProfile();
  p.decks = p.decks || {};
  p.stats = p.stats || {};
  p.stats.byFaction = p.stats.byFaction || {};
  p.ach = p.ach || {};
  if (typeof p.sfx !== "boolean") p.sfx = true;
  if (typeof p.tut !== "boolean") p.tut = false;
  return p;
}

function saveProfile() {
  try { localStorage.setItem("k6_profile_v1", JSON.stringify(PROFILE)); } catch (e) {}
}

PROFILE = loadProfile();

  PROFILE.fact1 = FACTION; PROFILE.fact2 = FACTION2;

}

var MAX_HAND = 5;
var MAX_BOARD = 4;
var MAX_RES = 12;
var DECK_SIZE = 40;
var MAX_COPIES = 3;

function fxOf(key) { return (DEFS[key] || {}).fx || null; }
function orderNeedsTarget(key) { var fx = fxOf(key); return !!(fx && fx.k === "target"); }

function factionCardKeys(faction) {
  return Object.keys(DEFS).filter(function (k) { return DEFS[k].f === faction; });
}
function deckDefaultCounts(faction) {
  var m = {};
  (DECK_COMPS[faction] || []).forEach(function (c) { m[c[0]] = c[1]; });
  return m;
}
function validCustomDeck(faction) {
  var d = PROFILE.decks[faction];
  if (!d) return false;
  var total = 0;
  var keys = factionCardKeys(faction);
  for (var i = 0; i < keys.length; i++) {
    var n = d[keys[i]] || 0;
    if (n < 0 || n > MAX_COPIES) return false;
    total += n;
  }
  var all = Object.keys(d);
  for (var j = 0; j < all.length; j++) {
    if ((d[all[j]] || 0) > 0 && (DEFS[all[j]] || {}).f !== faction) return false;
  }
  return total === DECK_SIZE;
}

function buildDeck(faction) {
  var list = [];
  var counts = validCustomDeck(faction) ? PROFILE.decks[faction] : deckDefaultCounts(faction);
  Object.keys(counts).forEach(function (k) {
    if (!DEFS[k] || DEFS[k].f !== faction) return;
    var n = Math.min(counts[k] || 0, MAX_COPIES);
    for (var i = 0; i < n; i++) list.push(k);
  });
  for (var i = list.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = list[i]; list[i] = list[j]; list[j] = t;
  }
  return list;
}

function makeInst(key) {
  var d = DEFS[key];
  return { key: key, name: d.name, cost: d.cost, type: d.type || "unit", atk: d.atk, hp: d.hp, maxHp: d.hp, guard: !!d.guard, air: !!d.air, canAttack: false };
}

}

function say(msg) { if (MODE === "ai" && ACTOR === 1) msg = flipPOV(msg); LAST_MSG = msg; log(msg); }

function flipPOV(s) {
  return s.replace(/Your |Enemy |the enemy HQ|your HQ/g, function (m) {
    if (m === "Your ") return "Enemy ";
    if (m === "Enemy ") return "Your ";
    if (m === "the enemy HQ") return "your HQ";
    return "the enemy HQ";
  });
}

function setTurnBar(name) {
  document.getElementById("turnbar").textContent = name + "'s Turn";
}

// ---------------- Sound & effects ----------------
var SFX = PROFILE.sfx;
var AC = null;

function tone(freq, dur, type, vol, delay) {
  if (!SFX) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    var t0 = AC.currentTime + (delay || 0);
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "square";
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.04, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}

function sfx(name) {
  if (name === "click") tone(440, .04, "square", .03);
  else if (name === "play") tone(520, .09, "square", .05);
  else if (name === "order") { tone(430, .07, "triangle", .05); tone(640, .09, "triangle", .05, .07); }
  else if (name === "attack") { tone(210, .1, "sawtooth", .05); tone(120, .14, "sawtooth", .05, .05); }
  else if (name === "hit") tone(90, .18, "square", .06);
  else if (name === "draw") tone(700, .05, "triangle", .035);
  else if (name === "win") { tone(660, .12, "square", .05); tone(880, .14, "square", .05, .12); tone(1100, .2, "square", .05, .26); }
  else if (name === "ach") { tone(784, .1, "sine", .05); tone(1046, .16, "sine", .05, .09); }
  else if (name === "lose") { tone(300, .2, "sawtooth", .05); tone(180, .3, "sawtooth", .05, .18); }
}

function toggleSound() {
  SFX = !SFX;
  PROFILE.sfx = SFX; saveProfile();
  var b = document.getElementById("soundBtn");
  if (b) b.textContent = "SOUND " + (SFX ? "ON" : "OFF");
  if (SFX) sfx("click");
}

function flashFX() {
  var f = document.getElementById("flash");
  if (!f) return;
  f.classList.add("on");
  setTimeout(function () { f.classList.remove("on"); }, 160);
}

function shakeFX() {
  var f = document.getElementById("fit");
  if (!f) return;
  f.classList.remove("shake");
  void f.offsetWidth;
  f.classList.add("shake");
}

// ---------------- Turn flow ----------------
function drawStarting(p) {
  draw(p, 4);
}

function newGame(f0, f1) {
  AI_TICK++;
  var fa = f0 || FACTION, fb = f1 || FACTION2;
  if (MODE === "ai") fb = aiFaction();
  FACTION = fa; FACTION2 = fb; saveFaction();
  S = { cur: 0, over: false, winner: 0, attackSel: null, readyOrder: null, overShown: false, pub: { hand: [0, 0], deck: [0, 0] } };
  S.players = [freshPlayer(fa), freshPlayer(fb)];
  S.players[0].deck = buildDeck(fa);
  S.players[1].deck = buildDeck(fb);
  drawStarting(S.players[0]); drawStarting(S.players[1]);
  syncPub(0); syncPub(1);
  beginTurn(0);
}

function draw(p, n) {
  for (var i = 0; i < n; i++) {
    if (p.deck.length === 0 || p.hand.length >= MAX_HAND) break;
    p.hand.push(makeInst(p.deck.shift()));
  }
  syncPub(S.players.indexOf(p));
}

function beginTurn(p) {
  if (S.over) return;
  var pl = S.players[p];
  pl.turnNum++;
  pl.res = Math.min(pl.turnNum, MAX_RES);
  pl.board.forEach(function (u) { u.canAttack = true; });
  draw(pl, 1);
  S.cur = p;
  setTurnBar("Player " + (p + 1));
  render();
}

function endTurn() {
  if (S.over) return;
  if (MODE === "online") { onlineEndTurn(); return; }
  if (MODE === "ai") { aiEndTurn(); return; }
  S.readyOrder = null;
  var next = other(S.cur);
  S.cur = next;
  beginTurn(next);
  showModal("Hand to Player " + (next + 1),
            "Click Continue when Player " + (next + 1) + " is ready.",
            "Continue", function () { hideModal(); });
}

// ---------------- Playing cards ----------------
function play(hidx) {
  if (!canAct()) return;
  if (S.over) return;
  ACTOR = S.cur;
  if (S.readyOrder !== null) {
    if (S.readyOrder.hidx === hidx) { S.readyOrder = null; render(); }
    else log("Finish targeting " + S.players[S.cur].hand[S.readyOrder.hidx].name + " first.");
    return;
  }
  var pl = S.players[S.cur];
  var inst = pl.hand[hidx];
  if (!inst) return;
  if (inst.cost > pl.res) return;
  if (orderNeedsTarget(inst.key)) {
    if (S.players[other(S.cur)].board.length === 0) { log("No enemy units to target!"); return; }
    S.readyOrder = { hidx: hidx, key: inst.key };
    log("Choose a target for " + inst.name + ". Click the card again to cancel.");
    render();
    return;
  }
  if (inst.type !== "order" && pl.board.length >= MAX_BOARD) { log("Board is full!"); return; }
  pl.res -= inst.cost;
  pl.hand.splice(hidx, 1);
  if (inst.type === "order") {
    sfx("order");
    resolveOrder(inst, S.cur);
    syncPub(S.cur);
    render();
    if (MODE === "online") publish();
    if (checkVictory()) return;
    return;
  }
  pl.board.push(inst);
  if (pl.board.length >= MAX_BOARD) track("fullBoards");
  if (inst.atk >= 6) track("bigUnits");
  sfx("play");
  resolveBattlecry(inst, S.cur);
  syncPub(S.cur);
  render();
  if (MODE === "online") publish();
  if (checkVictory()) return;
}

function resolveOrderTarget(tidx) {
  if (!canAct()) return;
  if (S.readyOrder === null) return;
  ACTOR = S.cur;
  var pl = S.players[S.cur];
  var inst = pl.hand[S.readyOrder.hidx];
  var foe = S.players[other(S.cur)];
  var def = foe.board[tidx];
  if (!inst || !def) return;
  var n = (fxOf(inst.key) || {}).n || 1;
  pl.res -= inst.cost;
  pl.hand.splice(S.readyOrder.hidx, 1);
  def.hp -= n;
  say(inst.name + " hits " + def.name + " for " + n + "!");
  cleanBoard(foe);
  S.readyOrder = null;
  syncPub(S.cur);
  render();
  if (MODE === "online") publish();
  if (checkVictory()) return;
}

function resolveOrder(inst, p) {
  var me = S.players[p];
  var foe = S.players[other(p)];
  var fx = fxOf(inst.key);
  if (!fx) return;
  var n = fx.n || 0, k = fx.k;
  if (k === "res") {
    me.res = Math.min(me.res + n, MAX_RES);
    say(inst.name + ": +" + n + " resource!");
  } else if (k === "draw") {
    draw(me, n);
    say(inst.name + ": drew " + n + " card" + (n === 1 ? "" : "s") + "!");
  } else if (k === "rally") {
    me.board.forEach(function (u) { u.canAttack = true; });
    say(inst.name + ": all Your units can attack again!");
  } else if (k === "hq") {
    foe.hq -= n;
    say(inst.name + ": the enemy HQ takes " + n + "!");
  } else if (k === "heal") {
    me.hq += n;
    if (isHuman(p)) track("heals");
    say(inst.name + ": your HQ recovers " + n + "!");
  } else if (k === "aoe") {
    if (foe.board.length > 0) {
      foe.board.forEach(function (u) { u.hp -= n; });
      say(inst.name + " strikes all Enemy units for " + n + "!");
      cleanBoard(foe);
    } else {
      foe.hq -= n;
      say(inst.name + ": the enemy HQ takes " + n + "!");
    }
  }
}

function resolveBattlecry(inst, p) {
  if (inst.type === "order") return;
  var me = S.players[p], foe = S.players[other(p)];
  var fx = fxOf(inst.key);
  if (!fx) return;
  var n = fx.n || 0, k = fx.k;
  if (k === "haste") {
    inst.canAttack = true;
    say(inst.name + " is ready to attack!");
  } else if (k === "heal") {
    me.hq += n;
    if (isHuman(p)) track("heals");
    say(inst.name + " repairs your HQ for " + n + ".");
  } else if (k === "hq") {
    foe.hq -= n;
    say(inst.name + " shells the enemy HQ for " + n + "!");
  } else if (k === "aoe") {
    foe.board.forEach(function (u) { u.hp -= n; });
    say(inst.name + " strikes all Enemy units for " + n + "!");
    cleanBoard(foe);
  } else if (k === "snipe") {
    var best = null;
    foe.board.forEach(function (u) { if (!best || u.atk > best.atk) best = u; });
    if (best) {
      best.hp -= n;
      say(inst.name + " hits " + best.name + " for " + n + "!");
      cleanBoard(foe);
    } else {
      say(inst.name + " finds no target.");
    }
  } else if (k === "random") {
    if (foe.board.length > 0) {
      var t = foe.board[Math.floor(Math.random() * foe.board.length)];
      t.hp -= n;
      say(inst.name + " hits " + t.name + " for " + n + "!");
      cleanBoard(foe);
    } else {
      foe.hq -= n;
      say(inst.name + " shells the enemy HQ for " + n + "!");
    }
  } else if (k === "buff") {
    var cnt = 0;
    me.board.forEach(function (u) { if (u !== inst) { u.atk += n; if (u.atk >= 6 && isHuman(p)) track("bigUnits"); cnt++; } });
    say(cnt > 0 ? inst.name + " rallies Your units: +" + n + " attack!" : inst.name + " takes the field.");
  } else if (k === "draw") {
    draw(me, n);
    say(inst.name + ": drew " + n + " card" + (n === 1 ? "" : "s") + "!");
  }
}

function cleanBoard(p) {
  p.board = p.board.filter(function (u) { return u.hp > 0; });
}

// ---------------- AI OPPONENT ----------------
var AI_DELAY = 900;

function aiEndTurn() {
  if (S.over) return;
  S.readyOrder = null;
  S.attackSel = null;
  beginTurn(1);
  setTurnBar("Computer");
  render();
  var t = AI_TICK;
  setTimeout(function () { aiStep(t); }, 600);
}

function aiStep(t) {
  if (t !== AI_TICK || MODE !== "ai" || S.over) return;
  var ai = S.players[1];
  if (aiPlayOne(ai)) { if (checkVictory()) return; render(); setTimeout(function () { aiStep(t); }, AI_DELAY); return; }
  if (aiAttackOne(ai)) { if (checkVictory()) return; render(); setTimeout(function () { aiStep(t); }, AI_DELAY); return; }
  aiFinish();
}

function aiPlayOne(ai) {
  ACTOR = 1;
  for (var i = 0; i < ai.hand.length; i++) {
    var c = ai.hand[i];
    if (c.type === "order") continue;
    if (c.cost <= ai.res && ai.board.length < MAX_BOARD) {
      ai.res -= c.cost;
      ai.hand.splice(i, 1);
      ai.board.push(c);
      sfx("play");
      resolveBattlecry(c, 1);
      syncPub(1);
      return true;
    }
  }
  for (var j = 0; j < ai.hand.length; j++) {
    var o = ai.hand[j];
    if (o.type !== "order") continue;
    if (o.cost > ai.res) continue;
    if (orderNeedsTarget(o.key) && S.players[0].board.length === 0) continue;
    var ofx = fxOf(o.key) || {};
    if (ofx.k === "rally") {
      var canRally = false;
      for (var r = 0; r < ai.board.length; r++) { if (!ai.board[r].canAttack) { canRally = true; break; } }
      if (!canRally) continue;
    }
    if (ofx.k === "draw" && ai.hand.length >= MAX_HAND) continue;
    if (ofx.k === "res" && ai.res >= MAX_RES) continue;
    ai.res -= o.cost;
    ai.hand.splice(j, 1);
    sfx("order");
    if (orderNeedsTarget(o.key)) {
      var foes = S.players[0].board;
      var t = aiPickTarget(foes);
      if (t) {
        var dmg = (fxOf(o.key) || {}).n || 1;
        t.hp -= dmg;
        say(o.name + " hits " + t.name + " for " + dmg + "!");
        cleanBoard(S.players[0]);
      }
    } else {
      resolveOrder(o, 1);
    }
    syncPub(1);
    return true;
  }
  return false;
}

function aiAttackOne(ai) {
  ACTOR = 1;
  for (var i = 0; i < ai.board.length; i++) {
    var u = ai.board[i];
    if (!u.canAttack) continue;
    var tgt = legalTargets(u);
    if (tgt.units.length > 0) {
      var def = aiPickDef(tgt.units, u);
      def.hp -= u.atk;
      u.hp -= def.atk;
      say("Your " + u.name + " fights the enemy " + def.name + ": deals " + u.atk + ", takes " + def.atk + ".");
      if (def.hp <= 0) say("Enemy " + def.name + " is destroyed!");
      if (u.hp <= 0) say("Your " + u.name + " is destroyed!");
      u.canAttack = false;
      cleanBoard(S.players[0]);
      cleanBoard(ai);
    } else if (tgt.hq) {
      S.players[0].hq -= u.atk;
      say("Your " + u.name + " strikes the enemy HQ for " + u.atk + "!");
      u.canAttack = false;
      shakeFX();
    } else {
      u.canAttack = false;
    }
    sfx("attack"); sfx("hit"); flashFX();
    syncPub(1);
    return true;
  }
  return false;
}

function aiPickTarget(foes) {
  var best = null;
  for (var i = 0; i < foes.length; i++) {
    if (!best || foes[i].atk > best.atk) best = foes[i];
  }
  return best;
}

function aiPickDef(units, u) {
  var killable = units.filter(function (d) { return d.hp <= u.atk; });
  var pool = killable.length ? killable : units;
  var best = pool[0];
  for (var i = 1; i < pool.length; i++) { if (pool[i].atk > best.atk) best = pool[i]; }
  return best;
}

function aiFinish() {
  if (S.over) return;
  S.readyOrder = null;
  S.attackSel = null;
  S.cur = 0;
  beginTurn(0);
}

// ================= ONLINE MODE =================
var MODE = "local";
var NET = null;

function status(txt) {
  var el = document.getElementById("onlineStatus");
  if (el) el.textContent = txt || "";
}

function showLobby() {
  var el = document.getElementById("lobby");
  if (!el || MODE !== "online" || !NET) return;
  el.style.display = "flex";
  lobbyRender();
}

function hideLobby() {
  var el = document.getElementById("lobby");
  if (el) el.style.display = "none";
}

function lobbyRender() {
  if (!NET || MODE !== "online") return;
  var isHost = NET.id === 0;
  document.getElementById("lobbyRoom").textContent = NET.code || "";
  document.getElementById("lobbyHost").textContent = NET.meName + (isHost ? "  (you)" : "");
  document.getElementById("lobbyP2").textContent = isHost ? (NET.foeName || "—") : NET.foeName + "  (you)";
  document.getElementById("lobbyWait").textContent = isHost
    ? (NET.foeName ? "Opponent ready. Press START BATTLE." : "Waiting for an opponent to join...")
    : "Waiting for the host to start...";
  var startBtn = document.getElementById("lobbyStart");
  startBtn.style.display = isHost ? "inline-block" : "none";
  startBtn.disabled = !isHost || !NET.foeName;
}

function startGame() {
  if (!NET || NET.started) return;
  if (NET.id === 0 && MQ.connected) mqClear("kards6/rooms/" + NET.code);
  NET.started = true;
  hideLobby();
  status("");
  onlineInit();
}

function lobbyStart() {
  if (!NET || NET.id !== 0 || !NET.foeName || NET.started) return;
  mqPublish(mqTarget("lobby"), { t: "start", s: NET.sess, c: NET.code, p0: NET.meName, p1: NET.foeName, f0: NET.f, f1: NET.foeF }, true);
  startGame();
}

var ROOMS = {};
var BROWSE = false;

function browseRooms() {
  BROWSE = true;
  ROOMS = {};
  document.getElementById("roomlist").classList.add("show");
  roomShowHint();
  mqConnect();
  mqSubscribe("kards6/rooms/+");
  if (!MQ.roomT) MQ.roomT = setInterval(roomPrune, 5000);
}

function refreshRooms() {
  if (!BROWSE) return;
  ROOMS = {};
  roomShowHint();
  mqSubscribe("kards6/rooms/+");
}

function closeRooms() {
  BROWSE = false;
  document.getElementById("roomlist").classList.remove("show");
  if (MQ.roomT) { clearInterval(MQ.roomT); MQ.roomT = null; }
}

function roomPrune() {
  if (!BROWSE) return;
  var now = Date.now();
  Object.keys(ROOMS).forEach(function (c) { if (now - ROOMS[c].ts > 60000) delete ROOMS[c]; });
  roomShowHint();
}

function mqRoomMsg(topic, msg) {
  if (!BROWSE) return;
  if (!msg || !msg.c || !msg.n) { var c = topic.slice(topic.lastIndexOf("/") + 1); if (ROOMS[c]) { delete ROOMS[c]; roomShowHint(); } return; }
  ROOMS[msg.c] = { n: msg.n, c: msg.c, ts: (msg.ts || Date.now()) };
  roomShowHint();
}

function roomShowHint() {
  var rows = document.getElementById("roomRows");
  var hint = document.getElementById("roomHint");
  var codes = Object.keys(ROOMS).sort();
  if (!codes.length) { rows.innerHTML = ""; hint.style.display = "block"; return; }
  hint.style.display = "none";
  rows.innerHTML = codes.map(function (c) {
    return '<div class="rrow"><span>' + ROOMS[c].n + '</span><span class="rrowc">' + c + '</span><button class="btn" onclick="joinRoom(\'' + c + '\')">JOIN</button></div>';
  }).join("");
}

function joinRoom(code) {
  closeRooms();
  document.getElementById("roomIn").value = code;
  if (MODE !== "online") setMode("online");
  if (!document.getElementById("onlinePanel")) return;
  joinGame();
}

function syncPub(p) {
  S.pub.hand[p] = S.players[p].hand.length;
  S.pub.deck[p] = S.players[p].deck.length;
}

function boardArr(p) {
  return p.board.map(function (u) { return { key: u.key, hp: u.hp, atk: u.atk }; });
}

function boardFromSnap(arr) {
  return (arr || []).map(function (s) {
    var u = makeInst(s.key);
    u.hp = s.hp; u.atk = s.atk;
    return u;
  });
}

function buildPublic() {
  return {
    from: NET.id,
    turn: S.turn,
    over: !!S.over,
    winner: S.winner || 0,
    reset: 0,
    hq: [S.players[0].hq, S.players[1].hq],
    res: [S.players[0].res, S.players[1].res],
    hand: S.pub.hand.slice(),
    deck: S.pub.deck.slice(),
    board: [boardArr(S.players[0]), boardArr(S.players[1])],
    faction: [S.players[0].faction, S.players[1].faction],
    msg: LAST_MSG
  };
}

function publish() {
  if (MODE !== "online" || !NET || !MQ.connected) return;
  NET.ver++;
  var snap = buildPublic();
  snap.ver = NET.ver;
  mqPublish(mqTarget("in" + other(NET.id)), { t: "snap", s: NET.sess, v: snap.ver, snap: snap }, true);
  LAST_MSG = "";
}

function applyPublic(snap) {
  if (!snap || snap.from === NET.id) return;
  if (S.over && !snap.reset) return;
  S.turn = snap.turn;
  for (var i = 0; i < 2; i++) {
    S.players[i].hq = snap.hq[i];
    S.players[i].res = snap.res[i];
    S.players[i].board = boardFromSnap(snap.board[i]);
    if (snap.faction) S.players[i].faction = snap.faction[i];
  }
  S.pub.hand = snap.hand.slice();
  S.pub.deck = snap.deck.slice();
  S.attackSel = null;
  S.readyOrder = null;
  if (snap.reset) { onlineInit(); return; }
  S.over = !!snap.over;
  S.winner = snap.winner || 0;
  if (snap.msg) log(flipPOV(snap.msg));
  render();
  if (!S.over && snap.turn === NET.id) {
    onlineBeginMyTurn();
  } else if (S.over && !S.overShown) {
    S.overShown = true;
    showModal("GAME OVER", pName(S.winner) + " has destroyed the enemy HQ!",
      (MODE === "online" ? "Rematch" : "New Game"),
      function () { hideModal(); if (MODE === "online") resetOnline(); else newGame(); });
  }
}

function onlineInit() {
  hideLobby();
  status("");
  S = { cur: NET.id, turn: NET.id, over: false, winner: 0, attackSel: null, readyOrder: null,
        started: true, overShown: false, pub: { hand: [0, 0], deck: [0, 0] } };
  var myF = NET.f || FACTION, foeF = NET.foeF || FACTION2;
  var pa = freshPlayer(myF), pb = freshPlayer(foeF);
  S.players = (NET.id === 0) ? [pa, pb] : [pb, pa];
  S.players[0].deck = buildDeck(S.players[0].faction);
  S.players[1].deck = buildDeck(S.players[1].faction);
  drawStarting(S.players[0]);
  drawStarting(S.players[1]);
  syncPub(0); syncPub(1);
  if (NET.id === 0) onlineBeginMyTurn();
  else { S.turn = 0; render(); }
}

function onlineBeginMyTurn() {
  if (S.over) return;
  var p = NET.id;
  var pl = S.players[p];
  pl.turnNum++;
  pl.res = Math.min(pl.turnNum, MAX_RES);
  pl.board.forEach(function (u) { u.canAttack = true; });
  draw(pl, 1);
  S.turn = p;
  render();
  publish();
}

function onlineEndTurn() {
  if (S.over) return;
  S.readyOrder = null;
  S.attackSel = null;
  S.turn = other(NET.id);
  render();
  publish();
}

function resetOnline() {
  if (MODE !== "online" || !NET) return;
  S.overShown = false;
  NET.ver++;
  var snap = buildPublic();
  snap.reset = 1;
  snap.over = false;
  snap.winner = 0;
  snap.turn = 0;
  snap.hq = [20, 20];
  snap.res = [0, 0];
  snap.hand = [4, 4];
  var ds = DECK_SIZE - 4;
  snap.deck = [ds, ds];
  snap.board = [[], []];
  snap.ver = NET.ver;
  if (MQ.connected) {
    mqPublish(mqTarget("in" + other(NET.id)), { t: "snap", s: NET.sess, v: NET.ver, snap: snap }, true);
  }
  onlineInit();
}

function pName(pid) {
  if (MODE === "online" && NET) {
    return pid === NET.id ? NET.meName : NET.foeName;
  }
  if (MODE === "ai") return pid === 1 ? "You" : "Computer";
  return "Player " + pid;
}

function factionLabel(p) {
  var f = FACTIONS[p.faction] || FACTIONS.usa;
  return f.flag + " " + f.name;
}

function myTurn() {
  if (MODE === "online") return !!NET && S && S.started && !S.over && S.turn === NET.id;
  if (MODE === "ai") return !!S && !S.over && S.cur === 0;
  return true;
}

function canAct() { return myTurn(); }

function genCode() {
  var letters = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  var s = "";
  for (var i = 0; i < 5; i++) s += letters[Math.floor(Math.random() * letters.length)];
  return s;
}

function genSess() { return Math.random().toString(36).slice(2, 10); }

function hostGame() {
  if (BROWSE) closeRooms();
  var name = (document.getElementById("nameIn").value || "").trim() || "Player#1";
  NET = { code: genCode(), id: 0, sess: genSess(), ver: 0, meName: name, foeName: "", f: FACTION, foeF: "", started: false };
  S = { cur: NET.id, turn: NET.id, over: false, winner: 0, attackSel: null, readyOrder: null, started: false, overShown: false, pub: { hand: [0, 0], deck: [0, 0] } };
  S.players = [freshPlayer(), freshPlayer()];
  status("Connecting to relay...");
  mqConnect();
}

function joinGame() {
  if (BROWSE) closeRooms();
  var name = (document.getElementById("nameIn").value || "").trim() || "Player#2";
  var code = (document.getElementById("roomIn").value || "").trim().toUpperCase();
  if (!code) { status("Enter the room code."); return; }
  NET = { code: code, id: 1, sess: genSess(), ver: 0, meName: name, foeName: "", f: FACTION, foeF: "", started: false };
  S = { cur: NET.id, turn: NET.id, over: false, winner: 0, attackSel: null, readyOrder: null, started: false, overShown: false, pub: { hand: [0, 0], deck: [0, 0] } };
  S.players = [freshPlayer(), freshPlayer()];
  status("Connecting to relay...");
  mqConnect();
}

// ============ ONLINE RELAY VIA PUBLIC MQTT (no server needed) ============
var MQ = {
  ws: null, connected: false, seq: 0, idx: 0, pingT: null,
  brokers: ["wss://broker.emqx.io:8084/mqtt", "wss://test.mosquitto.org:8081/mqtt"]
};

function mqEnc8(s) { return new TextEncoder().encode(s); }
function mqDec(a) { return new TextDecoder().decode(a); }

function mqStr(s) {
  var e = mqEnc8(s);
  var o = new Uint8Array(e.length + 2);
  o[0] = (e.length >> 8) & 255;
  o[1] = e.length & 255;
  o.set(e, 2);
  return o;
}

function mqVar(n) {
  var b = [];
  do {
    var d = n % 128;
    n = Math.floor(n / 128);
    if (n > 0) d |= 128;
    b.push(d);
  } while (n > 0);
  return b;
}

function mqPkt(type, flags, body) {
  var vl = mqVar(body.length);
  var out = new Uint8Array(1 + vl.length + body.length);
  out[0] = ((type << 4) | (flags & 15)) & 255;
  out.set(vl, 1);
  out.set(body, 1 + vl.length);
  return out.buffer;
}

function mqTarget(t) { return "kards6/" + NET.code + "/" + t; }

function mqSend(type, flags, body) {
  if (MQ.ws && MQ.ws.readyState === 1) MQ.ws.send(mqPkt(type, flags, body));
}

function mqConnect() {
  if (MQ.ws) { try { MQ.ws.onclose = null; MQ.ws.close(); } catch (e) {} MQ.ws = null; }
  var url = MQ.brokers[MQ.idx % MQ.brokers.length];
  MQ.connected = false;
  var ws = new WebSocket(url, "mqtt");
  MQ.ws = ws;
  ws.binaryType = "arraybuffer";
  ws.onopen = function () {
    var cid = "k6_" + Math.random().toString(36).slice(2, 12);
    var body = mqCat([mqStr("MQTT"), [4], [2], [0, 30], mqStr(cid)]);
    ws.send(mqPkt(1, 0, body));
  };
  ws.onmessage = function (ev) { mqHandle(ev.data); };
  ws.onclose = function () {
    MQ.connected = false;
    if (NET) { MQ.idx++; setTimeout(mqConnect, 2000); }
  };
  ws.onerror = function () { try { ws.close(); } catch (e) {} };
}

function mqClose() {
  if (MQ.pingT) { clearInterval(MQ.pingT); MQ.pingT = null; }
  if (MQ.ws) { MQ.ws.onclose = null; try { MQ.ws.close(); } catch (e) {} MQ.ws = null; }
  MQ.connected = false;
}

function stopPoll() { mqClose(); }

function mqCat(parts) {
  var arrs = parts.map(function (p) {
    if (typeof p === "number") return new Uint8Array([p]);
    if (p instanceof Uint8Array) return p;
    return new Uint8Array(p);
  });
  var len = 0;
  arrs.forEach(function (a) { len += a.length; });
  var out = new Uint8Array(len);
  var at = 0;
  arrs.forEach(function (a) { out.set(a, at); at += a.length; });
  return out;
}

function mqSubscribe(topic) {
  var pid = ++MQ.seq;
  var body = mqCat([[(pid >> 8) & 255, pid & 255], mqStr(topic), [0]]);
  mqSend(8, 2, body);
}

function mqPublish(topic, obj, retain) {
  var flags = 0x02 | (retain ? 0x01 : 0x00);
  var pid = ++MQ.seq;
  var body = mqCat([mqStr(topic), [(pid >> 8) & 255, pid & 255], mqEnc8(JSON.stringify(obj))]);
  mqSend(3, flags, body);
}

function mqClear(topic) {
  var pid = ++MQ.seq;
  var body = mqCat([mqStr(topic), [(pid >> 8) & 255, pid & 255]]);
  mqSend(3, 0x03, body);
}

function mqPing() { mqSend(12, 0, new Uint8Array(0)); }

function mqHandle(ab) {
  if (!ab) return;
  var d = new Uint8Array(ab);
  if (d.length < 2) return;
  var type = d[0] >> 4;
  var body = mqReadBody(d);
  if (!body) return;
  if (type === 2) { // CONNACK
    if (body.length >= 2 && body[1] === 0) {
      MQ.connected = true;
      mqReady();
      if (!MQ.pingT) MQ.pingT = setInterval(mqPing, 20000);
    } else {
      MQ.idx++; mqClose(); setTimeout(mqConnect, 2000);
    }
  } else if (type === 3) { // PUBLISH
    var flags = d[0] & 15;
    var bp = 0;
    var tlen = ((body[bp] << 8) | body[bp + 1]); bp += 2;
    var topic = mqDec(body.subarray(bp, bp + tlen)); bp += tlen;
    var qos = (flags >> 1) & 3;
    if (qos > 0) {
      var pid = ((body[bp] << 8) | body[bp + 1]); bp += 2;
      mqSend(4, 0, new Uint8Array([(pid >> 8) & 255, pid & 255]));
    }
    var obj = null;
    try { obj = JSON.parse(mqDec(body.subarray(bp))); } catch (e) {}
    mqOnMessage(topic, obj);
  }
}

function mqReadBody(d) {
  var p = 1, e, mult = 1, len = 0;
  do {
    if (p >= d.length) return null;
    e = d[p++];
    len += (e & 127) * mult;
    mult *= 128;
  } while ((e & 128) !== 0 && len < 1000000);
  if (p + len > d.length) return null;
  return d.subarray(p, p + len);
}

function mqReady() {
  if (BROWSE) mqSubscribe("kards6/rooms/+");
  if (!NET) return;
  mqSubscribe(mqTarget("lobby"));
  mqSubscribe(mqTarget("in" + NET.id));
  if (NET.id === 0) {
    mqPublish(mqTarget("lobby"), { t: "h", s: NET.sess, c: NET.code, n: NET.meName, f: NET.f }, true);
    mqPublish("kards6/rooms/" + NET.code, { n: NET.meName, c: NET.code, ts: Date.now() }, true);
  } else {
    mqPublish(mqTarget("lobby"), { t: "j", s: NET.sess, c: NET.code, n: NET.meName, f: NET.f }, true);
  }
  showLobby();
  if (NET.id === 0) status("Waiting for opponent... Room code: " + NET.code);
  else status("Joining room " + NET.code + "...");
}

function mqOnMessage(topic, msg) {
  if (topic.indexOf("kards6/rooms/") === 0) { mqRoomMsg(topic, msg); return; }
  if (!NET || !msg) return;
  if (topic === mqTarget("lobby")) {
    if (msg.t === "h" && NET.id === 1) {           // host hello (joiner sees it)
      if (msg.c === NET.code && msg.s !== NET.sess) {
        NET.sess = msg.s;                            // adopt the host's session
        mqPublish(mqTarget("lobby"), { t: "j", s: NET.sess, c: NET.code, n: NET.meName, f: NET.f }, true);
      }
      if (msg.c === NET.code && !NET.started) {
        NET.foeName = msg.n;
        NET.foeF = msg.f || NET.foeF;
        status("Room found. Waiting for the host to start...");
        lobbyRender();
      }
    } else if (msg.t === "j" && NET.id === 0) {    // join hello (host sees it)
      if (msg.c === NET.code && msg.s === NET.sess && !NET.started) {
        NET.foeName = msg.n;
        NET.foeF = msg.f || NET.foeF;
        status("Opponent joined: " + msg.n);
        lobbyRender();
      }
    } else if (msg.t === "start") {
      if (msg.c === NET.code && msg.s === NET.sess) {
        NET.foeName = (NET.id === 0) ? msg.p1 : msg.p0;
        NET.foeF = (NET.id === 0) ? (msg.f1 || NET.foeF) : (msg.f0 || NET.foeF);
        startGame();
      }
    }
    return;
  }
  if (topic === mqTarget("in" + NET.id)) {
    if (msg.t !== "snap" || msg.s !== NET.sess) return;
    if (msg.v <= NET.ver) return;
    if (!NET.started) { NET.started = true; onlineInit(); }
    NET.ver = msg.v;
    applyPublic(msg.snap);
  }
}

function setMode(m) {
  if (m === MODE) return;
  if (NET && NET.id === 0 && MQ.connected) mqClear("kards6/rooms/" + NET.code);
  if (NET) { stopPoll(); NET = null; }
  if (BROWSE) closeRooms();
  hideLobby();
  MODE = m;
  document.getElementById("modeLocal").classList.toggle("active", m === "local");
  document.getElementById("modeAi").classList.toggle("active", m === "ai");
  document.getElementById("modeOnline").classList.toggle("active", m === "online");
  document.getElementById("onlinePanel").style.display = (m === "online") ? "flex" : "none";
  status("");
  if (m === "local" || m === "ai") {
    newGame();
  } else {
    render();
  }
}

// ================= COMBAT =================
function legalTargets(srcInst) {
  var foe = S.players[other(S.cur)];
  var lists = { units: [], hq: false };
  if (srcInst.air) {
    lists.units = foe.board.slice();
    lists.hq = true;
  } else {
    var guards = foe.board.filter(function (u) { return u.guard; });
    if (guards.length > 0) {
      lists.units = guards;
    } else {
      lists.units = foe.board.slice();
      lists.hq = true;
    }
  }
  return lists;
}

function selectAttacker(uidx) {
  if (!canAct()) return;
  if (S.over) return;
  if (S.readyOrder !== null) return;
  var pl = S.players[S.cur];
  var inst = pl.board[uidx];
  if (!inst) return;
  if (!inst.canAttack) { log(inst.name + " has already attacked."); return; }
  if (S.attackSel === uidx) { S.attackSel = null; }
  else S.attackSel = uidx;
  render();
  if (S.attackSel !== null) {
    var targets = legalTargets(pl.board[S.attackSel]);
    var desc = targets.units.length ? targets.units.map(function (u) { return u.name; }).join(", ") : "none";
    if (targets.hq) desc += (desc ? " / " : "") + "HQ";
    log("Choose a target for " + pl.board[S.attackSel].name + "  [" + desc + "]. Click the unit again to cancel.");
  }
}

function doAttack(uidx, kind, tidx) {
  if (!canAct()) return;
  if (S.over) return;
  if (S.attackSel == null) return;
  ACTOR = S.cur;
  var me = S.players[S.cur];
  var foe = S.players[other(S.cur)];
  var att = me.board[S.attackSel];
  if (!att) return;
  sfx("attack");

  if (kind === "hq") {
    var targets = legalTargets(att);
    if (!targets.hq) return;
    foe.hq -= att.atk;
    say("Your " + att.name + " strikes the enemy HQ for " + att.atk + "!");
    att.canAttack = false;
    sfx("hit"); flashFX(); shakeFX();
  } else {
    var targets2 = legalTargets(att);
    var def = foe.board[tidx];
    if (!def || targets2.units.indexOf(def) === -1) return;
    def.hp -= att.atk;
    att.hp -= def.atk;
    say("Your " + att.name + " fights the enemy " + def.name + ": deals " + att.atk + ", takes " + def.atk + ".");
    if (def.hp <= 0) say("Enemy " + def.name + " is destroyed!");
    if (att.hp <= 0) say("Your " + att.name + " is destroyed!");
    att.canAttack = false;
    cleanBoard(foe);
    cleanBoard(me);
    sfx("hit"); flashFX();
  }

  S.attackSel = null;
  syncPub(S.cur);
  render();
  if (MODE === "online") publish();
  if (checkVictory()) return;
}

function checkVictory() {
  if (S.over) return true;
  var p0 = S.players[0], p1 = S.players[1];
  var winner = null;
  if (p0.hq <= 0) winner = 2;
  if (p1.hq <= 0) winner = 1;
  if (winner) {
    S.over = true;
    S.winner = winner;
    S.overShown = true;
    awardVictory(winner);
    if (MODE === "online") publish();
    if (MODE === "online" && NET) sfx((S.winner - 1) === NET.id ? "win" : "lose");
    else if (MODE === "ai") sfx(S.winner === 1 ? "win" : "lose");
    else sfx("win");
    shakeFX();
    showModal("GAME OVER", pName(winner) + " has destroyed the enemy HQ!",
      (MODE === "online" ? "Rematch" : "New Game"),
      function () { hideModal(); if (MODE === "online") resetOnline(); else newGame(); });
    return true;
  }
  return false;
}

// ---------------- Modal ----------------
function showModal(title, text, btn, fn) {
  document.getElementById("mTitle").textContent = title;
  document.getElementById("mText").textContent = text;
  document.getElementById("mTip").textContent = "";
  var b = document.getElementById("mBtn");
  b.textContent = btn;
  b.onclick = fn;
  document.getElementById("modal").classList.add("show");
}

function hideModal() { document.getElementById("modal").classList.remove("show"); }

// ---------------- Rendering ----------------
function cnameStyle(name) {
  var l = name.length;
  var fs = l >= 13 ? 7 : (l >= 11 ? 8 : (l >= 9 ? 9 : 10));
  return ' style="font-size:' + fs + 'px"';
}

function handHTML(pl, isActive, cnt) {
  var html = "";
  var n = isActive ? pl.hand.length : (cnt || 0);
  var interactive = canAct();
  for (var i = 0; i < n; i++) {
    var inst = isActive ? pl.hand[i] : null;
    if (isActive) {
      var foeUnits = S.players[other(S.cur)].board.length;
      var playable = interactive && inst.cost <= pl.res && (inst.type === "order" ? (!orderNeedsTarget(inst.key) || foeUnits > 0) : pl.board.length < MAX_BOARD);
      var skillTxt = (inst.type !== "order" && DEFS[inst.key].fx) ? DEFS[inst.key].text : "";
      var hasskill = (inst.type !== "order" && DEFS[inst.key].fx) ? " hasskill" : "";
      html += '<div class="cardwrap"><div class="card ' + (playable ? "playable" : "unplayable") + (inst.type === "order" ? " order" : "") + hasskill + '" title="' + DEFS[inst.key].text + '" onclick="play(' + i + ')">' +
        '<div class="cost">' + inst.cost + '</div>' +
        '<div class="cname"' + cnameStyle(inst.name) + '>' + inst.name + '</div>' +
        '<div class="art">' + DEFS[inst.key].art + '</div>' +
        (inst.type === "order"
          ? '<div class="otext">' + DEFS[inst.key].text + '</div>'
          : '<div class="utext">' + skillTxt + '</div><div class="atk">' + inst.atk + '</div><div class="hp">' + inst.hp + '</div>') +
        '</div></div>';
    } else {
      html += '<div class="cardwrap"><div class="cardback"></div></div>';
    }
  }
  return html;
}

function boardHTML(pl, role) {
  var html = "";
  var mine = (role === 'mine');
  var foe = (role === 'foe');
  for (var i = 0; i < pl.board.length; i++) {
    var inst = pl.board[i];
    var cls = "card";
    var attm = '';

    if (mine) {
      if (canAct()) {
        if (i === S.attackSel) { cls += " selected"; attm = ' onclick="selectAttacker(' + i + ')"'; }
        else if (inst.canAttack) { attm = ' onclick="selectAttacker(' + i + ')"'; }
      }
      if (!inst.canAttack) cls += " exhausted";
    } else if (foe) {
      if (canAct() && S.readyOrder !== null) {
        cls += " targetable";
        attm = ' onclick="resolveOrderTarget(' + i + ')"';
      } else if (canAct() && S.attackSel != null) {
        var att = S.players[S.cur].board[S.attackSel];
        if (att) {
          var tg = legalTargets(att);
          if (tg.units.indexOf(inst) !== -1) { cls += " targetable"; attm = ' onclick="doAttack(' + S.attackSel + ',&quot;u&quot;,' + i + ')"'; }
        }
      }
    }

    var badges = "";
    if (inst.guard) badges += '<div class="badge guard">GUARD</div>';
    if (inst.air) badges += '<div class="badge air">AIR</div>';

    var skillTxt = (inst.type !== "order" && DEFS[inst.key].fx) ? DEFS[inst.key].text : "";
    var hasskill = (inst.type !== "order" && DEFS[inst.key].fx) ? " hasskill" : "";
    html += '<div class="cardwrap"><div class="' + cls + hasskill + '"' + attm + ' title="' + DEFS[inst.key].text + '">' +
      '<div class="cost">' + inst.cost + '</div>' +
      '<div class="cname">' + inst.name + '</div>' +
      '<div class="art">' + DEFS[inst.key].art + '</div>' +
      badges +
      '<div class="utext">' + skillTxt + '</div>' +
      '<div class="atk">' + inst.atk + '</div>' +
      '<div class="hp">' + inst.hp + '</div>' +
      '</div></div>';
  }
  return html;
}

function hqTargetable() {
  if (!canAct()) return false;
  if (S.attackSel == null) return false;
  var att = S.players[S.cur].board[S.attackSel];
  if (!att) return false;
  return legalTargets(att).hq;
}

function render() {
  if (!S) return;
  var cur = (MODE === "online" && NET) ? NET.id : (MODE === "ai" ? 0 : S.cur);
  var foe = other(cur);
  var my = S.players[cur], en = S.players[foe];
  var canTargetHq = hqTargetable();
  var hqTgtCls = canTargetHq ? ' targetable' : '';
  var hqOnt = canTargetHq ? ' onclick="doAttack(' + S.attackSel + ',&quot;hq&quot;)"' : '';

  if (MODE === "online" && NET) {
    if (!S.started) setTurnBar("Waiting for opponent");
    else setTurnBar(pName(S.turn) + (S.turn === NET.id ? "  (you)" : ""));
  } else if (MODE === "ai") {
    setTurnBar(S.cur === 0 ? "Player 1" : "Computer");
  } else {
    setTurnBar("Player " + (cur + 1));
  }

  // top = opponent
  var topHTML = '<div class="prow">' +
      '<div class="stackbox"><div class="stackcard"></div><span>DECK ' + S.pub.deck[foe] + '</span><span>RES ' + en.res + '</span></div>' +
      '<div class="hqbox"><div class="hqcard' + hqTgtCls + '"' + hqOnt + '>' +
        '<div class="star">' + factionLabel(en) + '</div>' +
        '<div class="hpnum">' + Math.max(0, en.hq) + '</div>' +
        '<div class="hpbar-wrap"><div class="hpbar' + (en.hq <= 5 ? ' low' : '') + '" style="width:' + Math.min(100, Math.round(en.hq / 20 * 100)) + '%"></div></div>' +
      '</div></div>' +
      '<div class="stackbox"><div class="stackcard"></div><span></span><span></span></div>' +
    '</div>' +
    '<div class="hand">' + handHTML(en, false, S.pub.hand[foe]) + '</div>' +
    '<div class="boardrow">' + boardHTML(en, 'foe') + '</div>';
  document.getElementById("panelTop").innerHTML = topHTML;

  var midHTML = '<div class="boardrow">' + boardHTML(my, 'mine') + '</div>';
  document.getElementById("panelMid").innerHTML = midHTML;

  var myHq = '<div class="prow">' +
      '<div class="stackbox"><div class="stackcard"></div><span>DECK ' + S.pub.deck[cur] + '</span><span>RES ' + my.res + '</span></div>' +
      '<div class="hqbox"><div class="hqcard">' +
        '<div class="star">' + factionLabel(my) + '</div>' +
        '<div class="hpnum">' + Math.max(0, my.hq) + '</div>' +
        '<div class="hpbar-wrap"><div class="hpbar' + (my.hq <= 5 ? ' low' : '') + '" style="width:' + Math.min(100, Math.round(my.hq / 20 * 100)) + '%"></div></div>' +
      '</div></div>' +
      '<div class="stackbox"><div class="stackcard"></div><span></span><span></span></div>' +
    '</div>' +
    '<div class="hand">' + handHTML(my, true, 0) + '</div>';
  document.getElementById("panelBottom").innerHTML = myHq;

  var eBtn = document.getElementById("endBtn");
  var offlineWait = (MODE === "online") ? (!canAct() || !S.started) : (MODE === "ai" ? (S.cur !== 0) : false);
  eBtn.disabled = S.over || offlineWait;
  if (MODE === "online" && !canAct() && S.started) eBtn.textContent = "WAIT...";
  else if (MODE === "ai" && S.cur !== 0) eBtn.textContent = "COMPUTER...";
  else eBtn.textContent = "END TURN";
  document.getElementById("newBtn").disabled = (MODE === "online");
  fit();
}

function fit() {
  var stage = document.getElementById("stage");
  if (!stage) return;
  var w = stage.offsetWidth, h = stage.offsetHeight;
  if (!w || !h) return;
  var scale = Math.min(window.innerWidth / w, window.innerHeight / h, 1.35);
  stage.style.transform = "scale(" + scale + ")";
}
window.addEventListener("resize", fit);

document.getElementById("endBtn").onclick = function () { endTurn(); };
document.getElementById("newBtn").onclick = function () { newGame(); };

// ---------------- Tutorial ----------------
var TUT_STEPS = [
  { t: "1. THE GOAL", h: "<p>Each player commands an <b>HQ with 20 HP</b> \u2014 the enemy HQ is at the top, yours at the bottom.</p><p>Reduce the enemy HQ to <b>0 HP</b> and you win. If your HQ hits 0 first, you lose.</p>" },
  { t: "2. RESOURCES & TURNS", h: "<ul><li>Every turn you gain <b>+1 resource</b> (up to 12), so bigger cards unlock as the game goes on.</li><li>Cards you can afford <b>glow gold</b> \u2014 click one to play it. Cards you can't pay for look dark.</li><li><b>END TURN</b> passes play \u2014 in LOCAL the other player takes the screen, in VS AI the computer acts, in ONLINE you wait for your opponent.</li></ul>" },
  { t: "3. NATIONS", h: "<p>There are <b>5 nations</b>, each with its own <b>exclusive deck</b> of cards based on its real WW2 weapons. There are <b>no national buffs</b> \u2014 a nation is defined purely by its cards. Pick yours with the <b>NATION</b> button.</p><ul><li><b>USA</b> \u2605 \u2014 industrial might: Shermans, P-51s, B-17s, Marines.</li><li><b>UK</b> \u265b \u2014 Commonwealth: Spitfires, Commandos, radar, steady Guards.</li><li><b>GERMANY</b> \u2720 \u2014 Blitzkrieg: fast Panzers, Stukas, heavy Tigers.</li><li><b>USSR</b> \u262d \u2014 endless numbers: T-34s, Katyusha rockets, human waves.</li><li><b>JAPAN</b> \u2600 \u2014 aggressive air: cheap Zeros, banzai, kamikaze.</li></ul>" },
  { t: "4. UNITS", h: "<p>Units fill your front row (max 4). Blue circle = cost, red = attack, green = HP. Hover a card to read its power. Each nation's units are different \u2014 here are the shared <b>keywords</b>:</p><ul><li><b>Haste</b> \u2014 can attack the turn it is played.</li><li><b>Guard</b> \u2014 enemies must fight it first; it shields your HQ.</li><li><b>Air</b> \u2014 ignores Guard and can always strike the HQ.</li><li><b>Battlecries</b> \u2014 many units have an effect on play: healing your HQ, damaging the enemy HQ or their units, drawing cards, or giving your other units +1 attack.</li></ul>" },
  { t: "5. ATTACKING", h: "<ul><li>Click your unit, then click an enemy unit or the enemy HQ.</li><li>Each unit attacks <b>once per turn</b>. When two units fight, <b>both</b> deal their attack to each other.</li><li><b>Guard</b> units must be fought first \u2014 they shield the enemy HQ.</li><li><b>Air</b> units ignore Guard and can always hit the HQ.</li><li>A unit normally can't attack the turn it's played \u2014 unless it has <b>Haste</b>.</li></ul>" },
  { t: "6. ORDERS", h: "<p>Orders are one-shot cards \u2014 they resolve, then vanish. Each nation has its own orders. The shared effects are:</p><ul><li><b>Damage a unit</b> \u2014 click the order, then pick an enemy unit.</li><li><b>Damage the enemy HQ</b> \u2014 a direct strike.</li><li><b>Damage all enemy units</b> \u2014 a sweeping barrage (hits the HQ if their board is empty).</li><li><b>Heal your HQ</b> \u2014 recover hit points.</li><li><b>Draw cards</b> \u2014 refill your hand.</li><li><b>Gain resource</b> \u2014 bank energy for bigger plays.</li><li><b>Rally</b> \u2014 all your units can attack again.</li></ul>" },
  { t: "7. DECK BUILDER", h: "<ul><li>Open <b>DECK</b> to customize <b>your nation's</b> cards with the <b>+</b> and <b>-</b> buttons.</li><li>Your deck must have <b>exactly 40 cards</b>, with at most <b>3 copies</b> of any card.</li><li><b>USE DEFAULT</b> restores the standard 40-card deck, <b>SAVE</b> keeps your changes, <b>CLOSE</b> cancels.</li><li>A custom deck applies to your nation in the next LOCAL or VS AI game (the opponent uses their own nation's default deck).</li></ul>" },
  { t: "8. PLAY & MENU", h: "<ul><li><b>LOCAL</b> \u2014 two players share one screen (hot-seat).</li><li><b>VS AI</b> \u2014 battle the computer single-player.</li><li><b>ONLINE</b> \u2014 HOST gives you a room code to share, or press <b>ROOMS</b> to join a waiting game.</li><li><b>NATION</b> \u2014 choose your nation. <b>DECK</b> \u2014 build your deck.</li><li><b>TUTORIAL</b> reopens this guide, <b>\u2715</b>/<b>CLOSE</b> shuts it, <b>SOUND</b> toggles audio.</li></ul><p>Good luck, Commander!</p>" }
];
var TUT_PAGE = 0;

function openTutorial() {
  TUT_PAGE = 0;
  tutRender();
  document.getElementById("tutorial").classList.add("show");
}

function closeTutorial() {
  document.getElementById("tutorial").classList.remove("show");
  PROFILE.tut = true; saveProfile();
  track("tutDone");
}

function tutNext() {
  if (TUT_PAGE < TUT_STEPS.length - 1) { TUT_PAGE++; tutRender(); }
  else closeTutorial();
}

function tutPrev() {
  if (TUT_PAGE > 0) { TUT_PAGE--; tutRender(); }
}

function tutRender() {
  var s = TUT_STEPS[TUT_PAGE];
  document.getElementById("tTitle").textContent = s.t;
  document.getElementById("tBody").innerHTML = s.h;
  document.getElementById("tPage").textContent = (TUT_PAGE + 1) + " / " + TUT_STEPS.length;
  document.getElementById("tPrev").disabled = (TUT_PAGE === 0);
  document.getElementById("tNext").textContent = (TUT_PAGE === TUT_STEPS.length - 1) ? "CLOSE" : "NEXT";
}

function maybeShowTutorial() {
  if (!PROFILE.tut) openTutorial();
}

// ---------------- Faction picker ----------------
function factionSection(title, selected, which) {
  var rows = FACTION_KEYS.map(function (k) {
    var f = FACTIONS[k];
    return '<div class="frow' + (k === selected ? ' sel' : '') + '" onclick="pickFaction(' + which + ',\'' + k + '\')">' +
      '<span class="fflag">' + f.flag + '</span>' +
      '<div><div class="fname">' + f.name + '</div><div class="fdesc">' + f.desc + '</div></div>' +
      '</div>';
  }).join("");
  return '<div class="fpgroup">' + title + '</div>' + rows;
}

function openFactionPick() {
  var dual = (MODE === "local");
  var html = dual
    ? factionSection("PLAYER 1", FACTION, 1) + factionSection("PLAYER 2", FACTION2, 2)
    : factionSection("YOUR NATION", FACTION, 1);
  document.getElementById("fpRows").innerHTML = html;
  document.getElementById("fpTitle").textContent = dual ? "CHOOSE NATIONS" : "CHOOSE YOUR NATION";
  document.getElementById("factionpick").classList.add("show");
}

function closeFactionPick() { document.getElementById("factionpick").classList.remove("show"); }

function pickFaction(which, k) {
  if (which === 2) FACTION2 = k; else FACTION = k;
  saveFaction();
  closeFactionPick();
  if (MODE === "local" || MODE === "ai") newGame();
}

// ---------------- Deck builder ----------------
var DECK_WORK = null;
var DECK_WHICH = 1;
var DECK_FAC = "usa";

function deckRowSort(a, b) {
  var da = DEFS[a], db = DEFS[b];
  var ta = da.type === "order" ? 1 : 0, tb = db.type === "order" ? 1 : 0;
  if (ta !== tb) return ta - tb;
  if (da.cost !== db.cost) return da.cost - db.cost;
  return da.name.localeCompare(db.name);
}

function deckEditFaction() { return DECK_WHICH === 2 ? FACTION2 : FACTION; }

function openDeckEdit(which) {
  DECK_WHICH = (which === 2) ? 2 : 1;
  DECK_FAC = deckEditFaction();
  DECK_WORK = {};
  var src = validCustomDeck(DECK_FAC) ? PROFILE.decks[DECK_FAC] : deckDefaultCounts(DECK_FAC);
  factionCardKeys(DECK_FAC).forEach(function (k) { DECK_WORK[k] = src[k] || 0; });
  document.querySelector("#deckedit h2").textContent = "DECK BUILDER \u2014 " + FACTIONS[DECK_FAC].name;
  var whichEl = document.getElementById("deckWhich");
  if (whichEl) {
    whichEl.style.display = (MODE === "local") ? "flex" : "none";
    var b1 = document.getElementById("dw1"), b2 = document.getElementById("dw2");
    if (b1) b1.classList.toggle("active", DECK_WHICH === 1);
    if (b2) b2.classList.toggle("active", DECK_WHICH === 2);
  }
  renderDeckRows();
  document.getElementById("deckedit").classList.add("show");
}

function closeDeckEdit() { DECK_WORK = null; document.getElementById("deckedit").classList.remove("show"); }

function deckInc(k) { if (!DECK_WORK) return; if ((DECK_WORK[k] || 0) >= MAX_COPIES) return; DECK_WORK[k] = (DECK_WORK[k] || 0) + 1; renderDeckRows(); }
function deckDec(k) { if (!DECK_WORK) return; if ((DECK_WORK[k] || 0) > 0) DECK_WORK[k]--; renderDeckRows(); }

function deckUseDefault() { DECK_WORK = deckDefaultCounts(DECK_FAC); renderDeckRows(); }

function deckSave() {
  var t = deckTotalWork();
  if (t !== DECK_SIZE) {
    document.getElementById("deckInfo").textContent = "Deck must be exactly " + DECK_SIZE + " cards \u2014 currently " + t + ".";
    return;
  }
  PROFILE.decks[DECK_FAC] = DECK_WORK; DECK_WORK = null;
  saveProfile();
  track("decksSaved");
  document.getElementById("deckedit").classList.remove("show");
  if (MODE === "local" || MODE === "ai") newGame();
}

function deckTotalWork() {
  var n = 0;
  if (DECK_WORK) Object.keys(DECK_WORK).forEach(function (k) { n += (DECK_WORK[k] || 0); });
  return n;
}

function renderDeckRows() {
  if (!DECK_WORK) return;
  var keys = factionCardKeys(DECK_FAC).sort(deckRowSort);
  var html = "";
  keys.forEach(function (k) {
    var d = DEFS[k];
    var n = DECK_WORK[k] || 0;
    html += '<div class="drow"><span class="dname">' + d.name + '</span><span class="dtag">' + (d.type === "order" ? "ORDER" : "UNIT") + '</span>' +
      '<button class="btn dbtn" onclick="deckDec(\'' + k + '\')">-</button><span class="dnum">' + n + '</span>' +
      '<button class="btn dbtn" onclick="deckInc(\'' + k + '\')">+</button></div>';
  });
  document.getElementById("deckRows").innerHTML = html;
  var t = deckTotalWork();
  document.getElementById("deckInfo").textContent = "TOTAL: " + t + " / " + DECK_SIZE + " cards" + (t === DECK_SIZE ? "  \u2713" : "  (need exactly " + DECK_SIZE + ")");
}

// ---------------- Achievements ----------------
function isHuman(p) {
  if (MODE === "online") return NET ? (p === NET.id) : true;
  if (MODE === "ai") return p === 0;
  return true;
}

var ACHIEVEMENTS = [
  { id: "first_win", name: "First Victory", desc: "Win your first game." },
  { id: "win_10", name: "Warmonger", desc: "Win 10 games." },
  { id: "win_50", name: "Living Legend", desc: "Win 50 games." },
  { id: "win_ai", name: "Terminator", desc: "Defeat the AI." },
  { id: "win_local", name: "Couch Commander", desc: "Win a local (hot-seat) game." },
  { id: "win_online", name: "Field Marshal", desc: "Win an online game." },
  { id: "flawless", name: "Flawless", desc: "Win without losing any HQ HP." },
  { id: "blitz", name: "Blitzkrieg", desc: "Win before turn 6." },
  { id: "survivor", name: "Survivor", desc: "Win with 5 or fewer HQ HP left." },
  { id: "healer", name: "Field Medic", desc: "Heal your HQ." },
  { id: "fullboard", name: "Full Roster", desc: "Control 4 units at once." },
  { id: "bigunit", name: "Heavy Hitter", desc: "Have a unit with 6 or more attack." },
  { id: "deckbuilder", name: "Architect", desc: "Save a custom deck." },
  { id: "student", name: "Graduate", desc: "Complete the tutorial." }
];
FACTION_KEYS.forEach(function (k) {
  ACHIEVEMENTS.push({ id: "win_" + k, name: "Victory as " + FACTIONS[k].name, desc: "Win a game with the " + FACTIONS[k].name + " nation." });
});

function achCheck(st, id) {
  switch (id) {
    case "first_win": return st.wins >= 1;
    case "win_10": return st.wins >= 10;
    case "win_50": return st.wins >= 50;
    case "win_ai": return st.aiWins >= 1;
    case "win_local": return st.localWins >= 1;
    case "win_online": return st.onlineWins >= 1;
    case "flawless": return st.flawlessWins >= 1;
    case "blitz": return st.blitzWins >= 1;
    case "survivor": return st.closeWins >= 1;
    case "healer": return st.heals >= 1;
    case "fullboard": return st.fullBoards >= 1;
    case "bigunit": return st.bigUnits >= 1;
    case "deckbuilder": return st.decksSaved >= 1;
    case "student": return st.tutDone >= 1;
    default:
      if (id.indexOf("win_") === 0) { var f = id.slice(4); return (st.byFaction[f] || 0) >= 1; }
      return false;
  }
}

function checkAchievements() {
  var newly = [];
  for (var i = 0; i < ACHIEVEMENTS.length; i++) {
    var a = ACHIEVEMENTS[i];
    if (PROFILE.ach[a.id]) continue;
    try { if (achCheck(PROFILE.stats, a.id)) { PROFILE.ach[a.id] = true; newly.push(a); } } catch (e) {}
  }
  if (newly.length) {
    saveProfile();
    for (var j = 0; j < newly.length; j++) { showToast("Achievement unlocked: " + newly[j].name); sfx("ach"); }
  }
}

function track(statKey) {
  PROFILE.stats[statKey] = (PROFILE.stats[statKey] || 0) + 1;
  saveProfile();
  checkAchievements();
}

function awardVictory(winner) {
  var st = PROFILE.stats;
  st.games = (st.games || 0) + 1;
  var youWon = false;
  if (MODE === "online") youWon = (winner - 1) === (NET ? NET.id : 0);
  else if (MODE === "ai") youWon = (winner === 1);
  else youWon = true;
  if (youWon) {
    st.wins = (st.wins || 0) + 1;
    if (MODE === "ai") st.aiWins = (st.aiWins || 0) + 1;
    else if (MODE === "local") st.localWins = (st.localWins || 0) + 1;
    else if (MODE === "online") st.onlineWins = (st.onlineWins || 0) + 1;
    var wf = S.players[winner - 1].faction;
    st.byFaction[wf] = (st.byFaction[wf] || 0) + 1;
    var wHq = S.players[winner - 1].hq;
    if (wHq >= 20) st.flawlessWins = (st.flawlessWins || 0) + 1;
    var turn = Math.max(S.players[0].turnNum, S.players[1].turnNum);
    if (turn < 6) st.blitzWins = (st.blitzWins || 0) + 1;
    if (wHq <= 5) st.closeWins = (st.closeWins || 0) + 1;
  } else {
    st.losses = (st.losses || 0) + 1;
  }
  saveProfile();
  checkAchievements();
}

function openAchievements() {
  renderAchievements();
  document.getElementById("achieve").classList.add("show");
}

function closeAchievements() { document.getElementById("achieve").classList.remove("show"); }

function renderAchievements() {
  var unlocked = 0;
  for (var i = 0; i < ACHIEVEMENTS.length; i++) if (PROFILE.ach[ACHIEVEMENTS[i].id]) unlocked++;
  document.getElementById("achInfo").textContent = unlocked + " / " + ACHIEVEMENTS.length + " unlocked";
  var html = "";
  ACHIEVEMENTS.forEach(function (a) {
    var got = !!PROFILE.ach[a.id];
    html += '<div class="arow' + (got ? "" : " locked") + '">' +
      '<span class="aico">' + (got ? "\u2713" : "\u25cb") + '</span>' +
      '<div><div class="aname">' + a.name + '</div><div class="adesc">' + a.desc + '</div></div>' +
      '</div>';
  });
  document.getElementById("achRows").innerHTML = html;
}

function showToast(msg) {
  var t = document.getElementById("toast");
  if (!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function () { t.classList.remove("show"); }, 2600);
}

(function () { var b = document.getElementById("soundBtn"); if (b) b.textContent = "SOUND " + (SFX ? "ON" : "OFF"); })();

newGame();
maybeShowTutorial();
</script>
</body>
</html>
